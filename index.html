<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    SCAN.HTML: the attendants' scanning page.
    The same file is used in two places, and works out by itself which one it is in:
      1. In the management system (Apps Script). Each attendant's scanning link opens it.
         Google doesn't allow live camera video there, so attendants take a photo of
         each code, or type the ID.
      2. On GitHub Pages, as the live scanner (optional, see the guide). There the
         camera reads codes continuously, and the page talks to the attendance
         system through its web app link.
    The line with "pageData" is filled in by Attendance.gs. On GitHub Pages it stays
    as it is, and the page reads the attendant's link from its own address instead.
    The QR code reader (jsQR) is the first script after that line.
    At the end of class, the attendant taps Class ended: the end time and their answers to
    the attendants' feedback questions go to the system (submitClassEnd in Feedback.gs).
    An attendant's link scans only the class they are on duty in that day (Duties.gs); they tap
    Check in when they arrive. The head attendant's link scans every class, and their page also
    puts attendants on duty for the coming class days and shows the attendant sign-up link.
  -->
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b3a8c">
  <title>Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root {
      --ink: #1e2747;
      --muted: #586079;
      --line: #c5cddd;
      --paper: #eef1f7;
      --surface: #ffffff;
      --brand: #2b3a8c;
      --brand-press: #1f2b6e;
      --brand-soft: #e6e9f7;
      --on-brand: #ffffff;
      --link: #2b3a8c;
      --ring: #c38a2a;
      --good: #1f7a4d;
      --good-soft: #e2f3e9;
      --bad: #b42318;
      --bad-soft: #fdecea;
      --warn: #7a5000;
      --warn-soft: #fff3d6;
      --font: "Atkinson Hyperlegible", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8ebf5;
        --muted: #aab2c8;
        --line: #3b4462;
        --paper: #10131d;
        --surface: #181c29;
        --brand: #5468d4;
        --brand-press: #4456bd;
        --brand-soft: #252c4d;
        --link: #aab8ff;
        --ring: #e0a84a;
        --good: #67c995;
        --good-soft: #11291c;
        --bad: #ff8a80;
        --bad-soft: #3a1614;
        --warn: #f0c060;
        --warn-soft: #33270a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--font); }
    [hidden] { display: none !important; }

    .letterhead { background: #2b3a8c; color: #ffffff; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .letterhead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
    .course { margin: 0; font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
    .tag { flex: none; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, .18); font-size: 13px; font-weight: 700; }
    .names { min-width: 0; }
    .course-sub { margin: 1px 0 0; font-weight: 600; font-size: 13px; line-height: 1.3; opacity: .88; overflow-wrap: anywhere; }
    main.wrap { padding-top: 18px; padding-bottom: 28px; }
    footer.wrap { padding-bottom: 40px; color: var(--muted); font-size: 15px; }
    footer p { margin: 0 0 8px; }

    h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
    h2 { margin: 28px 0 10px; font-size: 20px; line-height: 1.3; }
    h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
    p { margin: 0 0 12px; }
    .meta { margin: 0 0 16px; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .banner { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
    .banner.warn { background: var(--warn-soft); color: var(--warn); }
    .banner.bad { background: var(--bad-soft); color: var(--bad); }

    /* The result of the last scan */
    .result { min-height: 96px; margin: 0 0 16px; padding: 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
    .result.good { border-color: var(--good); background: var(--good-soft); }
    .result.warn { border-color: var(--warn); background: var(--warn-soft); }
    .result.bad { border-color: var(--bad); background: var(--bad-soft); }
    .result-title { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 26px; font-weight: 700; line-height: 1.2; }
    .result.good .result-title { color: var(--good); }
    .result.warn .result-title { color: var(--warn); }
    .result.bad .result-title { color: var(--bad); }
    .who { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
    .face { flex: none; display: flex; align-items: center; justify-content: center; width: 88px; height: 88px; border-radius: 12px;
            object-fit: cover; background: var(--brand-soft); color: var(--brand); font-size: 30px; font-weight: 700; }
    .who-name { font-size: 20px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .who-sub { color: var(--muted); font-size: 15px; letter-spacing: .5px; }
    .result-text { margin: 0; overflow-wrap: anywhere; }
    .result-time { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    /* Buttons */
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 12px 20px;
              border: 2px solid transparent; border-radius: 12px; font: inherit; font-weight: 700; line-height: 1.2;
              text-align: center; text-decoration: none; cursor: pointer; }
    .button.primary { background: var(--brand); color: var(--on-brand); }
    .button.primary:active { background: var(--brand-press); }
    .button.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .button.big { width: 100%; min-height: 66px; font-size: 21px; }
    .button.wide { width: 100%; }
    .button svg { flex: none; width: 26px; height: 26px; }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .file-input:focus-visible + .button { outline: 3px solid var(--ring); outline-offset: 2px; }
    .linkish { margin: 0; padding: 10px 0; border: 0; background: none; color: var(--link); font: inherit;
               text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .stack > * + * { margin-top: 10px; }
    .row { display: flex; gap: 10px; }
    .row > .button { flex: 1 1 0; }
    .help { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .spinner { width: 20px; height: 20px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%;
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-right-color: currentColor; opacity: .6; } }

    /* Typing an ID */
    .type-form { margin-top: 6px; }
    .type-form label { display: block; margin: 0 0 6px; font-weight: 700; }
    .type-row { display: flex; gap: 10px; }
    .type-row input { flex: 1 1 auto; min-width: 0; min-height: 54px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px;
                      background: var(--surface); color: var(--ink); font: inherit; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    .type-row input:focus { border-color: var(--brand); outline: 3px solid var(--ring); outline-offset: 1px; }
    .type-row .button { flex: none; }
    .type-error { margin: 8px 0 0; color: var(--bad); font-size: 15px; font-weight: 700; }

    /* The live camera */
    .viewer { position: relative; overflow: hidden; margin: 0 0 10px; border-radius: 14px; background: #000000; aspect-ratio: 4 / 3; }
    .viewer video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; top: 12%; bottom: 12%; left: 50%; aspect-ratio: 1 / 1; transform: translateX(-50%);
             border: 4px solid rgba(255, 255, 255, .92); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .28); pointer-events: none; }
    .viewer.paused .frame { border-color: rgba(255, 255, 255, .4); }
    .viewer .viewer-start { position: absolute; left: 24px; right: 24px; top: 50%; width: auto; transform: translateY(-50%); }
    .viewer-note { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(0, 0, 0, .6);
                   color: #ffffff; font-size: 15px; text-align: center; }

    /* Today's lists */
    .class-card { margin: 0 0 12px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
    .class-card > summary { cursor: pointer; font-size: 18px; font-weight: 700; }
    .class-card[open] > summary { margin-bottom: 8px; }
    .counts { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 0 0 10px; font-size: 15px; }
    .counts b { font-size: 18px; }
    .c-good b { color: var(--good); }
    .c-warn b { color: var(--warn); }
    .c-bad b { color: var(--bad); }
    .list-title { margin: 0 0 4px; font-weight: 700; }
    .missing { margin: 0; padding: 0; list-style: none; }
    .missing li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .missing .id { flex: none; color: var(--muted); font-size: 15px; letter-spacing: 1px; }
    .updated { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    .staff { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 15px; overflow-wrap: anywhere; }
    .mini { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px;
            object-fit: cover; background: var(--brand-soft); color: var(--brand); font-size: 16px; font-weight: 700; }
    .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--muted); }
    .online-line { margin: 0 0 10px; font-size: 15px; }

    /* Class ended */
    .end { margin: 14px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
    .end p { margin: 0 0 8px; }
    .done-line { color: var(--good); font-weight: 700; overflow-wrap: anywhere; }
    .end-form h3 { margin: 0 0 12px; }
    .end-time { margin: 0 0 24px; }
    .end-time label { display: block; margin: 0 0 4px; font-weight: 700; }
    .end-time input { display: block; width: 100%; max-width: 220px; min-height: 52px; padding: 10px 14px; border: 2px solid var(--line);
                      border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
    .end-time input:focus { border-color: var(--brand); outline: 3px solid var(--ring); outline-offset: 1px; }
    .end-time.invalid input { border-color: var(--bad); }
    .banner.good { background: var(--good-soft); color: var(--good); }

    /* Duties: checking in, the coming duties, and the head attendant's placing */
    .mode-switch { margin: 0 0 16px; }
    .hand { margin: 0 0 16px; padding: 16px; border: 2px solid var(--brand); border-radius: 14px; background: var(--surface); }
    .hand h2 { margin: 0 0 10px; font-size: 20px; }
    .hand .step { margin: 0 0 12px; font-weight: 700; }
    .pages-list { margin: 0 0 12px; padding: 0; list-style: none; }
    .pages-list li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .pages-list .ok { color: var(--good); font-weight: 700; }
    .pages-list .wait { color: var(--muted); }
    .answers-line { margin: 4px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .3px; }
    .duty-card { margin: 0 0 16px; padding: 14px 16px; border: 2px solid var(--brand); border-radius: 12px; background: var(--surface); }
    .duty-card h2 { margin: 0 0 6px; font-size: 19px; }
    .duty-card p { margin: 0 0 10px; }
    .duty-card .checked { margin: 0; color: var(--good); font-weight: 700; }
    .duties { margin: 0 0 12px; padding: 0; list-style: none; }
    .duties li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .duty-line { margin: 0 0 10px; font-size: 15px; overflow-wrap: anywhere; }
    .day-plan { margin: 0 0 12px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
    .day-plan > summary { cursor: pointer; font-size: 17px; font-weight: 700; }
    .inbox { margin: 28px 0 8px; border-top: 1px solid var(--line); padding-top: 14px; }
    .inbox > summary { cursor: pointer; font-size: 17px; font-weight: 700; padding: 6px 0; }
    .inbox textarea { margin: 6px 0 4px; }
    .inbox-label { display: block; font-weight: 700; margin-top: 8px; }
    .day-plan[open] > summary { margin-bottom: 8px; }
    .pick { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 8px 0;
            border-top: 1px solid var(--line); }
    .pick label { flex: 1 1 160px; font-weight: 700; overflow-wrap: anywhere; }
    .pick select { flex: 0 1 190px; min-height: 48px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px;
                   background: var(--surface); color: var(--ink); font: inherit; }
    .pick select.changed { border-color: var(--brand); }
    .linkbox { display: block; width: 100%; min-height: 84px; margin: 0 0 10px; padding: 10px 12px; border: 2px solid var(--line);
               border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; resize: none; }

    /* Questions: the same in the students' feedback form and the attendants' Class ended form
       (build.js puts this part into both pages). */
    .q-field { margin: 0 0 24px; border: 0; padding: 0; min-width: 0; }
    .q-label { display: block; margin: 0 0 4px; padding: 0; font-weight: 700; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
    .q-optional { font-weight: 400; color: var(--muted); }
    .q-help { margin: 0 0 10px; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
    .q-input { display: block; width: 100%; min-height: 52px; margin: 0; padding: 12px 14px; font: inherit; color: var(--ink);
               background: var(--surface); border: 2px solid var(--line); border-radius: 10px; }
    textarea.q-input { min-height: 120px; resize: vertical; }
    select.q-input { -webkit-appearance: none; appearance: none; padding-right: 44px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
    .q-input:focus { border-color: var(--brand); outline: 3px solid var(--ring); outline-offset: 1px; }
    .q-input[disabled] { opacity: .7; }
    .q-options { display: grid; gap: 8px; }
    .q-option { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; background: var(--surface);
                border: 2px solid var(--line); border-radius: 10px; cursor: pointer; overflow-wrap: anywhere; }
    .q-option input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--brand); }
    .q-option:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
    .q-scale { display: flex; flex-wrap: wrap; gap: 8px; }
    .q-chip { position: relative; flex: 1 0 44px; }
    .q-chip input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .q-chip span { display: flex; align-items: center; justify-content: center; min-height: 52px; background: var(--surface);
                   border: 2px solid var(--line); border-radius: 10px; font-weight: 700; }
    .q-chip input:checked + span { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .q-chip input:focus-visible + span { outline: 3px solid var(--ring); outline-offset: 2px; }
    .q-ends { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; color: var(--muted); font-size: 15px; }
    .q-clear { margin: 4px 0 0; padding: 8px 0; border: 0; background: none; color: var(--link); font: inherit; font-size: 15px;
               text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .q-field.invalid .q-input, .q-field.invalid .q-option, .q-field.invalid .q-chip span { border-color: var(--bad); }
    .q-error { margin: 8px 0 0; color: var(--bad); font-weight: 700; font-size: 15px; }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    // In this script, \u2026 is "...", \u00b7 a middle dot, \u2013 a dash, \u2713 a tick
    // and \u2717 a cross, written as codes so copying the file can't garble them.
    var GENERIC = 'Something went wrong, so this scan was not saved. Please scan the code again.';
    var OFFLINE = "Couldn't reach the management system, so this scan was not saved. Check the internet connection, then scan again.";
    var NOT_CONNECTED = "The management system answered, but not the way the live scanner expects, so this scan was not saved. " +
      'Please tell the head attendant: the web app may need a new version (see the guide).';
    var ID_CHARS = '23456789BCDFGHJKMNPQRSTVWXYZ';                    // the same letters as in Code.gs
    var APP_PATTERN = /^https:\/\/script\.google\.com\/(a\/[^\/\s]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec$/;
    var TOKEN_PATTERN = /^[a-kmnp-z2-9]{24}$/;                          // an attendant's secret link code
    var IN_GOOGLE = !!(window.google && google.script && google.script.run);
    var app = document.getElementById('app');

    var D = null;                                // what the system sent: attendant, class, course, today's lists
    var link = { app: '', token: '' };           // on GitHub Pages: the system's web app link and the attendant's code
    var st = { busy: false, seq: 0, lastStatusAt: 0, statusBusy: false, shown: null, sound: loadSound(), open: {},
               status: null, ending: {}, ended: {} };   // ending: Class ended forms being filled in; ended: sent from this page
    var ui = {};                                 // the parts of the page that change
    var cam = { on: false, starting: false, paused: false, stream: null, track: null, timer: 0,
                lastText: '', lastSeen: 0, holdUntil: 0, torch: false, wake: null, resume: false };
    var photos = {};                             // student photos already fetched, by ID
    var adminPhotos = {};                        // administrators' photos already fetched, by Administrator ID
    var detector = null;                         // the phone's own QR reader (Android Chrome), if it has one
    var audio = null;

    // ------------------------------------------------------------------
    //  Small tools
    // ------------------------------------------------------------------

    /** Makes an element: h('p', { class: 'help', text: 'Hello' }, child, child) */
    function h(tag, props) {
      var el = document.createElement(tag);
      var p = props || {};
      Object.keys(p).forEach(function (k) {
        var v = p[k];
        if (v === undefined || v === null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'hidden') el.hidden = true;
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
      for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
      return el;
    }
    function add(el, child) {
      if (child === undefined || child === null || child === false) return;
      if (Array.isArray(child)) { child.forEach(function (c) { add(el, c); }); return; }
      el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    function show() {
      app.textContent = '';
      for (var i = 0; i < arguments.length; i++) add(app, arguments[i]);
    }
    /** The top of the page: the academy's name, with the course under it (Settings: Academy name, Course name). d: the page's data. */
    function letterhead(d) {
      var academy = (d && d.academyName) || '';
      var course = (d && d.courseName) || '';
      return h('header', { class: 'letterhead' }, h('div', { class: 'wrap' },
        h('div', { class: 'names' }, h('p', { class: 'course', text: academy || course || 'Management system' }),
          academy && course && course !== academy ? h('p', { class: 'course-sub', text: course }) : null),
        IN_GOOGLE ? null : h('span', { class: 'tag', text: 'Live scanner' })));
    }
    function banner(kind, text) { return h('p', { class: 'banner ' + kind, role: kind === 'bad' ? 'alert' : null, text: text }); }
    function spinner() { return h('span', { class: 'spinner', 'aria-hidden': 'true' }); }
    function initials(name) {
      var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      return ((parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
    }
    function cameraIcon() {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('fill', 'currentColor');
      path.setAttribute('d', 'M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z');
      svg.appendChild(path);
      return svg;
    }

    /** The Student ID inside a scanned code (a link ending ?id=K7Q2-M9XD) or typed in; '' if there isn't one. */
    function idFromText(text) {
      var t = String(text === undefined || text === null ? '' : text).trim();
      if (!t || t.length > 500) return '';
      var m = /[?&]id=([^&#\s]+)/i.exec(t);
      var raw = m ? m[1] : t;
      try { raw = decodeURIComponent(raw); } catch (e) { /* keep it as it is */ }
      var s = raw.toUpperCase().replace(/[^0-9A-Z]/g, '');
      if (s.length !== 8) return '';
      for (var i = 0; i < s.length; i++) if (ID_CHARS.indexOf(s.charAt(i)) === -1) return '';
      return s.slice(0, 4) + '-' + s.slice(4);
    }

    /** Asks the management system something: inside Google with google.script.run, on GitHub Pages through the web app link. */
    function call(api, args, onOk, onFail) {
      if (IN_GOOGLE) {
        var name = { scan: 'scanCode', status: 'getClassStatus', photo: 'getStudentPhoto', adminPhoto: 'getAdministratorPhoto',
          end: 'submitClassEnd', info: 'getScannerInfo', checkin: 'attendantCheckIn', duties: 'saveAttendantDuties',
          message: 'messageFromAttendant' }[api];
        var runner = google.script.run.withSuccessHandler(onOk).withFailureHandler(onFail);
        runner[name].apply(runner, [D.token].concat(args));
        return;
      }
      var body = { api: api, attendant: link.token };
      if (api === 'scan') { body.text = args[0]; body.how = args[1]; if (args[2]) body.retry = args[2]; }
      if (api === 'photo' || api === 'adminPhoto') body.id = args[0];
      if (api === 'end') { body.className = args[0]; body.ended = args[1]; body.answers = args[2]; }
      if (api === 'duties') body.changes = args[0];
      if (api === 'message') body.text = args[0];
      if (!window.fetch) { onFail(new Error('This browser is too old.')); return; }
      var stopper = window.AbortController ? new AbortController() : null;
      var timer = stopper ? setTimeout(function () { stopper.abort(); }, 25000) : 0;   // give up after 25 seconds
      fetch(link.app, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // keeps the request simple, so Google accepts it
        body: JSON.stringify(body),
        cache: 'no-store',
        credentials: 'omit',
        signal: stopper ? stopper.signal : undefined
      }).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { data = undefined; }
        if (data === undefined || data === null || typeof data !== 'object') {
          var wrong = new Error('The answer was not what the scanner expects.');
          wrong.notConnected = true;   // usually: the web app wasn't given a new version after the update
          onFail(wrong);
        } else {
          onOk(data);
        }
      }, function (err) {
        clearTimeout(timer);
        onFail(err);
      });
    }

    // ------------------------------------------------------------------
    //  Questions
    //  The same code shows the students' feedback form and the attendants'
    //  Class ended form (build.js puts it into both pages). Each question
    //  comes from the Feedback questions tab, like:
    //  { key, label, type, required, help, choices, scale: { min, max, minLabel, maxLabel } }
    //  The types: short, paragraph, radio, checkbox, dropdown, scale, number.
    // ------------------------------------------------------------------

    var QUESTION_EMPTY = {
      short: 'Please answer this question.', paragraph: 'Please answer this question.', radio: 'Please choose one.',
      dropdown: 'Please choose one.', checkbox: 'Please tick at least one.', scale: 'Please choose a number.',
      number: 'Please enter a number.'
    };

    function isBlank(value) {
      if (Array.isArray(value)) return !value.length;
      return String(value === undefined || value === null ? '' : value).trim() === '';
    }

    /** The same checks the system makes, so mistakes show at once. '' means the answer is fine. */
    function checkQuestion(q, value) {
      var v = typeof value === 'string' ? value.trim() : value;
      if (isBlank(v)) return q.required ? QUESTION_EMPTY[q.type] || 'Please answer this question.' : '';
      if (q.type === 'short' && v.length > 300) return 'Please keep this under 300 characters.';
      if (q.type === 'paragraph' && v.length > 3000) return 'Please keep this under 3000 characters.';
      if (q.type === 'number' && (!/^-?\d+(\.\d+)?$/.test(v) || Math.abs(Number(v)) > 1e15)) return 'Please enter a number, using digits only.';
      return '';
    }

    /**
     * Shows the questions inside box. prefix keeps the boxes' ids apart.
     * Returns tools to read the answers, check them, and show messages in red.
     */
    function questionsForm(box, questions, prefix) {
      var list = questions || [];
      // When every question is optional, the page says so once instead of beside each question.
      var markOptional = list.some(function (q) { return q.required; });
      var fields = list.map(function (q, i) { return questionField(q, prefix + '-' + i, markOptional); });
      fields.forEach(function (f) { add(box, f.wrap); });
      // On a phone, "Go" in a one-line box moves to the next question instead of sending the form early.
      box.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        e.preventDefault();
        var all = Array.prototype.slice.call(box.querySelectorAll('input, select, textarea'));
        var next = all[all.indexOf(e.target) + 1];
        if (next) next.focus();
      });
      return {
        count: fields.length,
        read: function () {
          var out = {};
          fields.forEach(function (f) { out[f.q.key] = f.read(); });
          return out;
        },
        /** { question: message } for each answer that isn't right yet. */
        check: function () {
          var errors = {};
          fields.forEach(function (f) {
            var message = checkQuestion(f.q, f.read());
            if (message) errors[f.q.key] = message;
          });
          return errors;
        },
        /** True when at least one question is answered. */
        answered: function () {
          return fields.some(function (f) { return !isBlank(f.read()); });
        },
        /** Puts each message under its question, clears the others, and gives back the first one marked. */
        show: function (errors) {
          var first = null;
          fields.forEach(function (f) {
            var message = errors ? errors[f.q.key] : '';
            if (message) {
              fieldError(f, message);
              if (!first) first = f;
            } else {
              fieldClear(f);
            }
          });
          return first;
        },
        disable: function (on) {
          fields.forEach(function (f) {
            f.inputs.forEach(function (x) { x.disabled = on; });
            if (f.clearButton) f.clearButton.disabled = on;
          });
        }
      };
    }

    /** One question: its label, help text, answer box or choices, and the place for its message. */
    function questionField(q, id, markOptional) {
      var helpId = id + '-help';
      var errId = id + '-err';
      var described = (q.help ? helpId + ' ' : '') + errId;
      var group = q.type === 'radio' || q.type === 'checkbox' || q.type === 'scale';
      var wrap = h(group ? 'fieldset' : 'div', { class: 'q-field' });
      var title = [q.label, !q.required && markOptional ? h('span', { class: 'q-optional', text: ' (optional)' }) : null];
      add(wrap, group ? h('legend', { class: 'q-label' }, title) : h('label', { class: 'q-label', for: id }, title));
      if (q.help) add(wrap, h('p', { class: 'q-help', id: helpId, text: q.help }));
      var f = { q: q, wrap: wrap, inputs: [], clearButton: null, error: h('p', { class: 'q-error', id: errId, hidden: true }) };
      var control;

      if (group) {
        if (q.type === 'scale') {
          var s = q.scale || { min: 1, max: 5 };
          var row = h('div', { class: 'q-scale' });
          for (var n = s.min; n <= s.max; n++) {
            var chip = h('input', { type: 'radio', name: id, value: String(n), 'aria-describedby': described });
            f.inputs.push(chip);
            add(row, h('label', { class: 'q-chip' }, chip, h('span', { text: String(n) })));
          }
          control = s.minLabel || s.maxLabel
            ? h('div', null, row, h('div', { class: 'q-ends' },
                h('span', { text: s.minLabel ? s.min + ' = ' + s.minLabel : '' }),
                h('span', { text: s.maxLabel ? s.max + ' = ' + s.maxLabel : '' })))
            : row;
        } else {
          control = h('div', { class: 'q-options' });
          (q.choices || []).forEach(function (c, j) {
            var input = h('input', { type: q.type, name: id, id: id + '-' + j, value: c, 'aria-describedby': described });
            f.inputs.push(input);
            add(control, h('label', { class: 'q-option', for: id + '-' + j }, input, h('span', { text: c })));
          });
        }
        f.read = function () {
          var picked = f.inputs.filter(function (x) { return x.checked; }).map(function (x) { return x.value; });
          return q.type === 'checkbox' ? picked : picked[0] || '';
        };
        f.focus = function () {
          var target = f.inputs.filter(function (x) { return x.checked; })[0] || f.inputs[0];
          if (target) target.focus();
        };
        // A choice can't be taken back by tapping it again, so an optional one gets a Clear link.
        if (!q.required && q.type !== 'checkbox') {
          f.clearButton = h('button', { type: 'button', class: 'q-clear', text: 'Clear my choice', hidden: true, onclick: function () {
            f.inputs.forEach(function (x) { x.checked = false; });
            f.clearButton.hidden = true;
            fieldClear(f);
            f.focus();
          } });
          wrap.addEventListener('change', function () { f.clearButton.hidden = !f.read(); });
        }
      } else {
        var attrs = { id: id, class: 'q-input', 'aria-describedby': described };
        var tag = 'input';
        if (q.type === 'paragraph') { tag = 'textarea'; attrs.maxlength = '3000'; attrs.rows = '4'; }
        else if (q.type === 'dropdown') { tag = 'select'; }
        else if (q.type === 'number') { attrs.type = 'text'; attrs.inputmode = 'decimal'; attrs.autocomplete = 'off'; attrs.enterkeyhint = 'next'; }
        else { attrs.type = 'text'; attrs.maxlength = '300'; attrs.autocomplete = 'off'; attrs.enterkeyhint = 'next'; }
        control = h(tag, attrs);
        if (q.type === 'dropdown') {
          add(control, h('option', { value: '', text: 'Choose\u2026' }));
          (q.choices || []).forEach(function (c) { add(control, h('option', { value: c, text: c })); });
        }
        f.inputs.push(control);
        f.read = function () { return control.value; };
        f.focus = function () { control.focus(); };
      }

      add(wrap, control);
      add(wrap, f.clearButton);
      add(wrap, f.error);
      var clear = function () { fieldClear(f); };   // typing or choosing takes the red message away
      wrap.addEventListener('input', clear);
      wrap.addEventListener('change', clear);
      return f;
    }

    function fieldError(f, message) {
      f.wrap.classList.add('invalid');
      f.error.textContent = message;
      f.error.hidden = false;
      f.inputs.forEach(function (x) { x.setAttribute('aria-invalid', 'true'); });
    }

    function fieldClear(f) {
      if (!f.wrap.classList.contains('invalid')) return;
      f.wrap.classList.remove('invalid');
      f.error.hidden = true;
      f.error.textContent = '';
      f.inputs.forEach(function (x) { x.removeAttribute('aria-invalid'); });
    }

    // ------------------------------------------------------------------
    //  Opening the page
    // ------------------------------------------------------------------

    /** The data Attendance.gs put in the page, or null on GitHub Pages (where the line is left as it is). */
    function readEmbeddedData() {
      var el = document.getElementById('page-data');
      var text = el ? el.textContent || '' : '';
      if (!text || text.indexOf('<' + '?') !== -1) return null;
      try { return JSON.parse(text); } catch (e) { return null; }
    }

    function readAddress() {
      var out = {};
      String(location.hash || '').replace(/^#/, '').split('&').forEach(function (part) {
        var i = part.indexOf('=');
        if (i < 1) return;
        try { out[decodeURIComponent(part.slice(0, i))] = decodeURIComponent(part.slice(i + 1)); } catch (e) { /* skip it */ }
      });
      return out;
    }

    function start() {
      var embedded = readEmbeddedData();
      if (embedded && embedded.token) { D = embedded; build(); return; }
      if (IN_GOOGLE) { fatal('This page needs an attendant link', 'Open it from the scanning link the head attendant sent you.'); return; }
      var address = readAddress();
      link.app = address.app || '';
      link.token = address.attendant || address.helper || '';   // helper= is the older name
      if (!APP_PATTERN.test(link.app) || !TOKEN_PATTERN.test(link.token)) {
        fatal("This live scanner link isn't complete",
          'Open your scanning link from the head attendant, then tap "Open the live scanner" on that page.');
        return;
      }
      show(letterhead(null), h('main', { class: 'wrap' }, h('p', { class: 'loading' }, spinner(), 'Opening the live scanner\u2026')));
      call('info', [], function (d) {
        if (d && d.ok && d.token) { D = d; build(); return; }
        if (d && d.blocked) fatal("This scanning link isn't active", 'Ask the head attendant for a new link.');
        else fatal("The scanner couldn't open", 'Please reload this page in a minute.', true);
      }, function (err) {
        if (err && err.notConnected) {
          fatal("The live scanner isn't connected yet", 'The management system answered, but not the way the live scanner expects. ' +
            'Please tell the head attendant: the web app needs a new version (see the guide).', true);
        } else {
          fatal("Couldn't reach the management system", 'Check the internet connection, then reload this page.', true);
        }
      });
    }

    function fatal(title, text, offerReload) {
      stopCamera();
      show(letterhead(D), h('main', { class: 'wrap' },
        h('h1', { text: title }), h('p', { text: text }),
        offerReload ? h('button', { type: 'button', class: 'button primary', text: 'Reload', onclick: function () { location.reload(); } }) : null));
    }

    // ------------------------------------------------------------------
    //  Building the page
    // ------------------------------------------------------------------

    /** Whether this page can scan: the head attendant always; an attendant on a class day only when on duty (any day can try the camera). */
    function canScan() {
      return D.allClasses || !!D.attendantClass || !D.isClassDay;
    }

    function build() {
      var scanning = canScan();
      var live = D.ready && scanning && (IN_GOOGLE ? cameraAllowedHere() : cameraPossible());
      document.title = D.attendantClass && !D.allClasses ? 'Scan \u2013 ' + D.attendantClass : 'Scan';
      ui.banners = h('div');
      ui.duty = h('div');
      ui.next = h('div');   // the coming duties: below the lists while scanning, so the camera stays near the top
      ui.result = h('section', { class: 'result', 'aria-live': 'polite', 'aria-atomic': 'true' });
      ui.status = h('section', { 'aria-label': "Today's lists" });
      ui.plan = D.allClasses && D.duty && D.duty.plan ? h('section', { 'aria-label': 'Attendants on duty' }) : null;
      show(
        letterhead(D),
        h('main', { class: 'wrap' },
          h('h1', { text: D.allClasses ? 'All classes' : D.attendantClass || (D.isClassDay ? 'Not on duty today' : 'Your duties') }),
          h('p', { class: 'meta' }, 'Scanning as ' + D.attendantName + (D.head ? ' (head attendant)' : '') + (D.attendantId ? ' \u00b7 ' + D.attendantId : ''), h('br'), D.dateText,
            D.lateText ? [h('br'), D.lateText] : null, D.scanText ? [h('br'), D.scanText] : null),
          ui.banners,
          ui.duty,
          buildModeSwitch(),
          D.ready && scanning && st.mode !== 'handin' ? [ui.result, buildControls(live)] : null,
          st.mode === 'handin' ? buildHandIn() : null,
          ui.status,
          ui.next,
          ui.plan,
          D.inbox ? buildInbox() : null),
        buildFooter(live));
      renderBanners();
      renderDuty();
      if (D.ready && scanning && st.mode !== 'handin') showReady(live);
      if (st.mode === 'handin') renderHand();
      renderStatus(D.status);
      if (ui.plan) renderPlan(D.duty.plan);
      if (st.started) return;   // the listeners and the timer are set once, even when the page is built again
      st.started = true;
      document.addEventListener('pointerdown', prepareSound, { passive: true });
      document.addEventListener('visibilitychange', onVisibility);
      setInterval(function () {
        if (!document.hidden && !st.busy && !endFormOpen() && Date.now() - st.lastStatusAt > 55000) refreshStatus(false);
      }, 15000);
    }

    /** Opens the page again with the latest from the system (for example when the head attendant changed this attendant's duty). */
    function reopen() {
      if (st.reopening) return;
      st.reopening = true;
      call('info', [], function (d) {
        st.reopening = false;
        if (d && d.ok && d.token) { stopCamera(); D = d; st.ending = {}; build(); return; }
        if (d && d.blocked) fatal("This scanning link isn't active", 'Ask the head attendant for a new link.');
      }, function () { st.reopening = false; });
    }

    function renderBanners() {
      ui.banners.textContent = '';
      if (!D.ready) add(ui.banners, banner('bad', "The system isn't set up yet, so codes can't be scanned. Please tell the head attendant."));
      if (D.testing) add(ui.banners, banner('warn', 'Testing mode: the system is treating today as ' + D.dateText + '.'));
      if (D.ready && !D.isClassDay) {
        add(ui.banners, banner('warn', "Today isn't a class day, so nothing is recorded. You can still scan a code to check that " +
          'your phone reads it. Attendance is taken on ' + D.classDay + 's.'));
      }
      // Settings: Scanning opens / Scanning closes. Codes scanned outside those times are read but not recorded.
      if (D.ready && D.isClassDay && D.scanClosed) {
        add(ui.banners, banner('warn', D.scanClosed + ' You can scan a code to check that your phone reads it, but nothing is recorded.'));
      }
    }

    // ------------------------------------------------------------------
    //  Duties: checking in, the coming duties, and (for the head attendant)
    //  putting attendants on duty and the attendant sign-up link
    // ------------------------------------------------------------------

    /** The top of the page: today's duty with Check in, or "not on duty today", and the coming duties. */
    function renderDuty() {
      ui.duty.textContent = '';
      ui.next.textContent = '';
      var d = D.duty;
      if (!d || !D.ready) return;
      var next = (d.upcoming || []).filter(function (x) { return !x.today; }).slice(0, 4);
      var nextList = next.length ? [h('p', { class: 'list-title', text: 'Your next duties' }),
        h('ul', { class: 'duties' }, next.map(function (x) {
          return h('li', { text: x.className + ' \u00b7 ' + x.dateText + (x.start ? ' \u00b7 starts ' + x.start : '') });
        }))] : null;
      if (D.isClassDay && (d.onDuty || d.head)) {
        var today = (d.upcoming || []).filter(function (x) { return x.today; })[0];
        var card = h('section', { class: 'duty-card', 'aria-label': 'Your duty today' },
          h('h2', { text: (d.head ? 'Head attendant today' : 'On duty today') + (today && today.start ? ' \u00b7 starts ' + today.start : '') }));
        if (d.checkedIn) {
          add(card, h('p', { class: 'checked', text: '\u2713 You checked in at ' + d.checkedIn + '.' }));
        } else {
          add(card, h('p', { text: d.head ? 'Tap Check in when you arrive.' : 'Tap Check in when you arrive. If you forget, your first scan checks you in.' }));
          ui.checkIn = h('button', { type: 'button', class: 'button primary wide', text: 'Check in', onclick: checkIn });
          add(card, ui.checkIn);
        }
        ui.dutyMessage = h('div', { 'aria-live': 'polite' });
        add(card, ui.dutyMessage);
        var others = d.head ? (d.heads || []).filter(function (x) { return !x.me; }) : [];
        if (others.length) {
          add(card, h('p', { class: 'help', text: 'Other head attendants: ' + others.map(function (x) {
            return x.name + (x.time ? ' (checked in ' + x.time + ')' : ' (not checked in yet)');
          }).join(', ') + '.' }));
        }
        add(ui.duty, card);
        if (nextList) add(ui.next, nextList);
        return;
      }
      if (d.head) return;
      if (D.isClassDay) {
        add(ui.duty, banner('warn', "You aren't on duty today, so you can't scan. If you should be, tell the head attendant. " +
          'This page changes by itself when you are put on duty.'));
      }
      add(ui.duty, nextList || h('p', { class: 'muted', text: "You aren't on duty on the coming class days yet. " +
        'When the head attendant puts you on duty, you get an email with your class.' }));
    }

    function checkIn() {
      if (!ui.checkIn || ui.checkIn.disabled) return;
      var again = function (kind, text) {
        ui.checkIn.disabled = false;
        ui.checkIn.textContent = 'Check in';
        ui.dutyMessage.textContent = '';
        add(ui.dutyMessage, banner(kind, text));
      };
      ui.checkIn.disabled = true;
      ui.checkIn.textContent = '';
      add(ui.checkIn, [spinner(), 'Checking in\u2026']);
      call('checkin', [], function (r) {
        if (r && r.blocked) { fatal("This scanning link isn't active", 'Ask the head attendant for a new link.'); return; }
        if (r && r.ok && r.checkedIn) { D.duty.checkedIn = r.checkedIn; renderDuty(); refreshStatus(false); return; }   // the class card shows it too
        again('bad', (r && r.message) || 'Something went wrong, so you were not checked in. Please tap Check in again.');
        if (r && /on duty/.test(r.message || '')) reopen();   // the duty was changed meanwhile
      }, function (err) {
        again('bad', err && err.notConnected ? NOT_CONNECTED.replace('this scan was not saved', 'you were not checked in')
          : "Couldn't reach the management system, so you weren't checked in. Check the internet connection, then tap Check in again.");
      });
    }

    /** What a refresh says about this attendant: a changed duty opens the page again; a check-in (by their first scan) shows. */
    function noteMe(me) {
      if ((me.className || '') !== (D.attendantClass || '')) { reopen(); return; }
      if (D.duty && (me.checkedIn || '') !== (D.duty.checkedIn || '')) {
        D.duty.checkedIn = me.checkedIn || '';
        renderDuty();
      }
    }

    /** The head attendant's part: who is on duty in which class on the coming class days, and the attendant sign-up link. */
    function renderPlan(plan) {
      ui.plan.textContent = '';
      st.planSelects = [];
      add(ui.plan, h('h2', { text: 'Attendants on duty' }));
      add(ui.plan, h('p', { class: 'help', text: 'Choose a class for each attendant on each class day, then tap Save duties. Each attendant ' +
        'is emailed their class and their own scanning link, and their link scans only that class on that day. A class can have more than one attendant.' }));
      if (!plan.names.length) {
        add(ui.plan, h('p', { class: 'muted', text: 'No attendants have signed up yet. Share the attendant sign-up link below with them.' }));
      } else {
        plan.days.forEach(function (day, d) {
          var selects = [];
          var onDuty = plan.names.filter(function (n) { return day.duties[n.toLowerCase()]; }).length;
          var box = h('details', { class: 'day-plan', open: d === 0 ? true : null },
            h('summary', { text: day.dateText + ' \u00b7 ' + onDuty + ' on duty' }));
          plan.names.forEach(function (name, i) {
            var id = 'duty-' + d + '-' + i;
            var select = h('select', { id: id });
            add(select, h('option', { value: '', text: 'Not on duty' }));
            plan.classes.forEach(function (c) { add(select, h('option', { value: c, text: c })); });
            select.value = day.duties[name.toLowerCase()] || '';
            select.dataset.key = day.key;
            select.dataset.name = name;
            select.dataset.was = select.value;
            select.addEventListener('change', function () { select.className = select.value === select.dataset.was ? '' : 'changed'; });
            selects.push(select);
            st.planSelects.push(select);
            add(box, h('div', { class: 'pick' }, h('label', { for: id, text: name }), select));
          });
          if (plan.names.some(function (n) { return day.prev[n.toLowerCase()]; })) {
            add(box, h('button', { type: 'button', class: 'linkish', text: 'Same as the week before', onclick: function () {
              selects.forEach(function (s) {
                s.value = day.prev[s.dataset.name.toLowerCase()] || '';
                s.className = s.value === s.dataset.was ? '' : 'changed';
              });
              planSay('warn', 'Filled in from the week before for ' + day.dateText + '. Check it, then tap Save duties.');
            } }));
          }
          add(ui.plan, box);
        });
        ui.planStatus = h('div', { 'aria-live': 'polite' });
        ui.planSave = h('button', { type: 'button', class: 'button primary wide', text: 'Save duties', onclick: savePlan });
        add(ui.plan, [ui.planStatus, ui.planSave]);
      }
      var share = h('section', { 'aria-label': 'Attendant sign-up link' }, h('h2', { text: 'New attendants' }));
      if (plan.signupLink) {
        var box2 = h('textarea', { class: 'linkbox', readonly: true, rows: '3', 'aria-label': 'The attendant sign-up link' });
        box2.value = plan.signupLink;
        box2.addEventListener('focus', function () { box2.select(); });
        box2.addEventListener('click', function () { box2.select(); });
        var copied = h('span', { class: 'muted', 'aria-live': 'polite' });
        add(share, [h('p', { text: 'Share this link with new attendants. They sign up once, then they appear above, ready to be put on duty.' }),
          box2, h('p', null, h('button', { type: 'button', class: 'button secondary', text: 'Copy link',
            onclick: function () { copyText(box2, copied); } }), ' ', copied)]);
      } else {
        add(share, h('p', { class: 'muted', text: 'There is no attendant sign-up link yet. Ask the System Manager to make one ' +
          '(Academy > Attendants > Make a new attendant sign-up link).' }));
      }
      add(ui.plan, share);
    }

    function planSay(kind, text) {
      if (!ui.planStatus) return;
      ui.planStatus.textContent = '';
      if (text) add(ui.planStatus, banner(kind, text));
    }

    function savePlan() {
      if (st.planBusy) return;
      var changes = st.planSelects.filter(function (s) { return s.value !== s.dataset.was; })
        .map(function (s) { return { key: s.dataset.key, name: s.dataset.name, className: s.value }; });
      if (!changes.length) { planSay('warn', 'Nothing to save: no duty was changed.'); return; }
      st.planBusy = true;
      ui.planSave.disabled = true;
      ui.planSave.textContent = '';
      add(ui.planSave, [spinner(), 'Saving\u2026']);
      var again = function () { ui.planSave.disabled = false; ui.planSave.textContent = 'Save duties'; };
      call('duties', [changes], function (r) {
        st.planBusy = false;
        if (r && r.blocked) { fatal("This scanning link isn't active", 'Ask the System Manager for a new link.'); return; }
        if (r && r.plan) { D.duty.plan = r.plan; renderPlan(r.plan); } else again();
        planSay(r && r.ok ? 'good' : 'bad', (r && r.message) || 'Something went wrong, so the duties were not saved. Please tap Save duties again.');
        if (r && r.ok) refreshStatus(false);   // today's cards show who is on duty
      }, function (err) {
        st.planBusy = false;
        again();
        planSay('bad', err && err.notConnected ? NOT_CONNECTED.replace('this scan was not saved', 'the duties were not saved')
          : "Couldn't reach the management system, so the duties were not saved. Check the internet connection, then tap Save duties again.");
      });
    }

    /** Copies the text in a box: with the phone's copy if it allows, otherwise by selecting it for the person to copy. */
    function copyText(box, out) {
      var done = function (ok) { out.textContent = ok ? 'Copied.' : 'Now copy the selected link.'; };
      var fallback = function () {
        box.focus();
        box.select();
        var ok = false;
        try { ok = !!(document.execCommand && document.execCommand('copy')); } catch (e) { ok = false; }
        done(ok);
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(box.value).then(function () { done(true); }, fallback);
          return;
        }
      } catch (e) { /* use the fallback */ }
      fallback();
    }

    function buildControls(live) {
      var box = h('section', { class: 'stack', 'aria-label': 'Scan' });
      if (live) {
        ui.video = h('video', { autoplay: true, playsinline: true, 'aria-label': 'Camera view' });
        ui.video.muted = true;
        ui.note = h('div', { class: 'viewer-note', text: 'The camera is off.' });
        ui.startLabel = h('span', { text: 'Start scanning' });
        ui.start = h('button', { type: 'button', class: 'button primary big viewer-start', onclick: onStart }, cameraIcon(), ui.startLabel);
        ui.viewer = h('div', { class: 'viewer' }, ui.video, h('div', { class: 'frame', 'aria-hidden': 'true' }), ui.note, ui.start);
        ui.pause = h('button', { type: 'button', class: 'button secondary', text: 'Pause', onclick: togglePause, hidden: true });
        ui.torch = h('button', { type: 'button', class: 'button secondary', text: 'Light on', onclick: toggleTorch, hidden: true });
        add(box, [ui.viewer, h('div', { class: 'row' }, ui.pause, ui.torch)]);
      }
      ui.photo = h('input', { type: 'file', id: 'scan-photo', class: 'file-input', accept: 'image/*', capture: 'environment', onchange: onPhoto });
      add(box, h('div', null, ui.photo,

    function handSay(kind, text) {
