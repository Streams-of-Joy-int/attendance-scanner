  <!--
    SCAN.HTML: the assistants' scanning page.
    The same file is used in two places, and works out by itself which one it is in:
      1. In the management system (Apps Script). Each assistant's scanning link opens it.
         Google doesn't allow live camera video there, so assistants take a photo of
         each code, or type the ID.
      2. On GitHub Pages, as the live scanner (optional, see the guide). There the
         camera reads codes continuously, and the page talks to the attendance
         system through its web app link.
    The line with "pageData" is filled in by Attendance.gs. On GitHub Pages it stays
    as it is, and the page reads the assistant's link from its own address instead.
    The QR code reader (jsQR) is the first script after that line.
    At the end of class, the assistant taps Class ended: the end time and their answers to
    the assistants' feedback questions go to the system (submitClassEnd in Feedback.gs).
    An assistant's link scans only the class they are on duty in that day (Duties.gs); they tap
    Check in when they arrive. The head assistant's link scans every class, and their page also
    puts assistants on duty for the coming class days and shows the assistant sign-up link.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root {
      --ink: #1e2747;
      --muted: #586079;
      --line: #c5cddd;
      --paper: #eef1f7;
      --surface: #ffffff;
      --brand: #2b3a8c;
      --brand-press: #1f2b6e;
      --brand-soft: #e6e9f7;
      --on-brand: #ffffff;
      --link: #2b3a8c;
      --ring: #c38a2a;
      --good: #1f7a4d;
      --good-soft: #e2f3e9;
      --bad: #b42318;
      --bad-soft: #fdecea;
      --warn: #7a5000;
      --warn-soft: #fff3d6;
      --font: "Atkinson Hyperlegible", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8ebf5;
        --muted: #aab2c8;
        --line: #3b4462;
        --paper: #10131d;
        --surface: #181c29;
        --brand: #5468d4;
        --brand-press: #4456bd;
        --brand-soft: #252c4d;
        --link: #aab8ff;
        --ring: #e0a84a;
        --good: #67c995;
        --good-soft: #11291c;
        --bad: #ff8a80;
        --bad-soft: #3a1614;
        --warn: #f0c060;
        --warn-soft: #33270a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--font); }
    [hidden] { display: none !important; }

    .letterhead { background: #2b3a8c; color: #ffffff; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    .letterhead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
    .course { margin: 0; font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
    .tag { flex: none; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .18); font-size: 15px; font-weight: 700; }
    .names { min-width: 0; }
    .course-sub { margin: 1px 0 0; font-weight: 600; font-size: 13px; line-height: 1.3; opacity: .88; overflow-wrap: anywhere; }
    main.wrap { padding-top: 18px; padding-bottom: 28px; }
    footer.wrap { padding-bottom: 40px; color: var(--muted); font-size: 15px; }
    footer p { margin: 0 0 8px; }

    h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
    h2 { margin: 28px 0 10px; font-size: 20px; line-height: 1.3; }
    h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
    p { margin: 0 0 12px; }
    .meta { margin: 0 0 16px; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
    /* The one line under the heading, and Details for the rest (A1) */
    .header-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; margin: 0 0 12px; }
    .meta-line { margin: 0; color: var(--muted); font-size: 15px; }
    .meta-more > summary { display: inline-flex; align-items: center; min-height: 44px; color: var(--link); font-size: 15px; cursor: pointer; }
    .meta-more[open] { flex: 1 1 100%; }
    .meta-more .meta { margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .banner { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
    .banner.warn { background: var(--warn-soft); color: var(--warn); }
    .banner.bad { background: var(--bad-soft); color: var(--bad); }
    .queue { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 15px; }
    .queue p { margin: 0; font-weight: 700; }
    .queue button { margin-top: 8px; }
    .queue ul { margin: 8px 0 0; padding-left: 18px; font-weight: 400; color: var(--ink); }
    .queue li { margin: 2px 0; }

    /* The result of the last scan */
    .result { min-height: 96px; margin: 0 0 16px; padding: 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
    .result.good { border-color: var(--good); background: var(--good-soft); }
    .result.warn { border-color: var(--warn); background: var(--warn-soft); }
    .result.bad { border-color: var(--bad); background: var(--bad-soft); }
    .result-title { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 26px; font-weight: 700; line-height: 1.2; }
    .result.good .result-title { color: var(--good); }
    .result.warn .result-title { color: var(--warn); }
    .result.bad .result-title { color: var(--bad); }
    .who { display: flex; align-items: center; gap: 14px; margin: 0 0 10px; }
    .face { flex: none; display: flex; align-items: center; justify-content: center; width: 88px; height: 88px; border-radius: 12px;
            object-fit: cover; background: var(--brand-soft); color: var(--brand); font-size: 30px; font-weight: 700; }
    /* Manual review: a photo put inside a .face box (Check a person) keeps to the box, whatever its own size. */
    .face { overflow: hidden; }
    .face img { display: block; width: 100%; height: 100%; max-width: 100%; object-fit: cover; }
    .person-card .face { width: 96px; height: 96px; }
    .who-name { font-size: 20px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .who-sub { color: var(--muted); font-size: 15px; letter-spacing: .5px; }
    .result-text { margin: 0; overflow-wrap: anywhere; }
    .result-time { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    /* Kiosk mode: students scan their own codes at the door; only the camera and the result card show. */
    body.kiosk #app > header, body.kiosk #app > footer { display: none; }
    body.kiosk #app > main > * { display: none; }
    body.kiosk #app > main > .result, body.kiosk #app > main > .stack, body.kiosk #app > main > .queue-box { display: block; }
    body.kiosk .stack > *:not(.viewer) { display: none; }
    body.kiosk #app > main { max-width: 760px; padding-top: 12px; }
    body.kiosk .result { min-height: 32vh; font-size: 24px; text-align: center; }
    body.kiosk .result-title { font-size: 44px; justify-content: center; }
    body.kiosk .who { justify-content: center; }
    body.kiosk .viewer video { transform: scaleX(-1); }
    .kiosk-exit { position: fixed; bottom: 10px; right: 10px; z-index: 50; max-width: calc(100% - 20px); padding: 8px; border-radius: 12px; background: var(--surface, #fff); opacity: .9; }
    .kiosk-exit input { width: 6em; min-height: 48px; font: inherit; font-size: 20px; letter-spacing: .3em; padding: 6px 10px; border: 2px solid #c9d1e3; border-radius: 10px; }
    .kiosk-exit .kiosk-pin-say { margin: 6px 0 0; color: var(--bad, #a40000); font-weight: 700; }
    .kiosk-pin-form input { max-width: 8em; letter-spacing: .3em; }

    /* Buttons */
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 12px 20px;
              border: 2px solid transparent; border-radius: 12px; font: inherit; font-weight: 700; line-height: 1.2;
              text-align: center; text-decoration: none; cursor: pointer; }
    .button.primary { background: var(--brand); color: var(--on-brand); }
    .button.primary:active { background: var(--brand-press); }
    .button.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
    .button.big { width: 100%; min-height: 66px; font-size: 21px; }
    .button.wide { width: 100%; }
    .button svg { flex: none; width: 26px; height: 26px; }
    /* A switch (Sound): a track with a knob, green when on */
    .switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 0; border: 0; background: none;
              color: var(--ink); font: inherit; cursor: pointer; }
    .switch .track { position: relative; flex: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line); }
    .switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #ffffff;
                            transition: left .15s; }
    .switch[aria-checked=true] .track { background: var(--good); }
    .switch[aria-checked=true] .track::after { left: 23px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 10px; }
    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .file-input:focus-visible + .button { outline: 3px solid var(--ring); outline-offset: 2px; }
    .linkish { display: inline-flex; align-items: center; min-height: 44px; margin: 0; padding: 10px 0; border: 0; background: none; color: var(--link); font: inherit;
               text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .stack > * + * { margin-top: 10px; }
    .row { display: flex; gap: 10px; }
    .row > .button { flex: 1 1 0; }
    .help { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .spinner { width: 20px; height: 20px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%;
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-right-color: currentColor; opacity: .6; } }

    /* Typing an ID */
    .type-form { margin-top: 6px; }
    .type-form label { display: block; margin: 0 0 6px; font-weight: 700; }
    .type-row { display: flex; gap: 10px; }
    .type-row input { flex: 1 1 auto; min-width: 0; min-height: 54px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 10px;
                      background: var(--surface); color: var(--ink); font: inherit; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    .type-row input:focus { border-color: var(--brand); outline: 3px solid var(--ring); outline-offset: 1px; }
    /* UX16 A9: the hint ("K7Q2-M9XD or phone") as written, not in capitals nor spaced out, so it isn't cut off. */
    .type-row input::placeholder { text-transform: none; letter-spacing: normal; font-size: 17px; }
    .type-row .button { flex: none; }
    .type-error { margin: 8px 0 0; color: var(--bad); font-size: 15px; font-weight: 700; }

    /* The live camera */
    .viewer { position: relative; overflow: hidden; margin: 0 0 10px; border-radius: 14px; background: #000000; aspect-ratio: 4 / 3; }
    .viewer video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; top: 12%; bottom: 12%; left: 50%; aspect-ratio: 1 / 1; transform: translateX(-50%);
             border: 4px solid rgba(255, 255, 255, .92); border-radius: 18px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .28); pointer-events: none; }
    .viewer.paused .frame { border-color: rgba(255, 255, 255, .4); }
    .viewer .viewer-start { position: absolute; left: 24px; right: 24px; top: 50%; width: auto; transform: translateY(-50%); }
    .viewer-note { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(0, 0, 0, .6);
                   color: #ffffff; font-size: 15px; text-align: center; }

    /* Today's lists */
    .class-card { margin: 0 0 12px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
    .class-card > summary { cursor: pointer; font-size: 18px; font-weight: 700; }
    .class-card[open] > summary { margin-bottom: 8px; }
    .counts { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 0 0 10px; font-size: 15px; }
    .counts b { font-size: 18px; }
    .c-good b { color: var(--good); }
    .c-warn b { color: var(--warn); }
    .c-bad b { color: var(--bad); }
    .c-good .sign { color: var(--good); }
    .c-warn .sign { color: var(--warn); }
    .c-bad .sign { color: var(--bad); }
    .list-title { margin: 0 0 4px; font-weight: 700; }
    .missing { margin: 0; padding: 0; list-style: none; }
    .person-check { margin: 8px 0 20px; }
    .person-form { margin-top: 16px; }
    .venue-form { margin-top: 12px; }
    .venue-form .row input { flex: 1; min-width: 0; min-height: 48px; font: inherit; font-size: 22px; letter-spacing: 4px; text-transform: uppercase;
      padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; }
    details.person-check > summary { font-weight: 700; font-size: 18px; min-height: 44px; display: flex; align-items: center; cursor: pointer; }
    .person-form .row input { flex: 1; min-width: 0; min-height: 48px; font: inherit; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; }
    .person-card.warn { border-color: #e08a00; background: #fff6e6; }
    .person-warn { color: #9a5b00; font-weight: 700; margin: 8px 0; }
    .person-lines { margin: 8px 0 0; padding-left: 20px; }
    .person-matches { list-style: none; padding: 0; margin: 0; }
    .person-matches li { border-top: 1px solid var(--line); }
    .missing li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .missing .id { flex: none; color: var(--muted); font-size: 15px; letter-spacing: 1px; }
    /* Tap a name (A2): each row is a button; tapping asks "Mark ... present?" in the row */
    .missing.pickable li { display: block; padding: 0; }
    .pick-name { display: flex; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 9px 4px; border: 0; background: none;
                 color: var(--link); font: inherit; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
    .pick-name > span:first-child { text-decoration: underline; text-underline-offset: 3px; }
    .pick-ask { padding: 10px 0; }
    .pick-question { margin: 0 0 8px; font-weight: 700; }
    .updated { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin: 4px 0 0; color: var(--muted); font-size: 15px; }
    .staff { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 15px; overflow-wrap: anywhere; }
    .mini { flex: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px;
            object-fit: cover; background: var(--brand-soft); color: var(--brand); font-size: 16px; font-weight: 700; }
    .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--muted); }
    .online-line { margin: 0 0 10px; font-size: 15px; }

    /* Class ended */
    .end { margin: 14px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
    .end p { margin: 0 0 8px; }
    .done-line { color: var(--good); font-weight: 700; overflow-wrap: anywhere; }
    .end-form h3 { margin: 0 0 12px; }
    .end-time { margin: 0 0 24px; }
    .end-time label { display: block; margin: 0 0 4px; font-weight: 700; }
    .end-time input { display: block; width: 100%; max-width: 220px; min-height: 52px; padding: 10px 14px; border: 2px solid var(--line);
                      border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
    .end-time input:focus { border-color: var(--brand); outline: 3px solid var(--ring); outline-offset: 1px; }
    .end-time.invalid input { border-color: var(--bad); }
    .banner.good { background: var(--good-soft); color: var(--good); }

    /* Duties: checking in, the coming duties, and the head assistant's placing */
    .mode-switch { margin: 0 0 16px; }
    .hand { margin: 0 0 16px; padding: 16px; border: 2px solid var(--brand); border-radius: 14px; background: var(--surface); }
    .hand h2 { margin: 0 0 10px; font-size: 20px; }
    .hand .step { margin: 0 0 12px; font-weight: 700; }
    .pages-list { margin: 0 0 12px; padding: 0; list-style: none; }
    .pages-list li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .pages-list .ok { color: var(--good); font-weight: 700; }
    .pages-list .wait { color: var(--muted); }
    .answers-line { margin: 4px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .3px; }
    .duty-card { margin: 0 0 16px; padding: 14px 16px; border: 2px solid var(--brand); border-radius: 12px; background: var(--surface); }
    .duty-card h2 { margin: 0 0 6px; font-size: 19px; }
    .duty-card p { margin: 0 0 10px; }
    .duty-card .checked { margin: 0; color: var(--good); font-weight: 700; }
    .duties { margin: 0 0 12px; padding: 0; list-style: none; }
    .duties li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .duties .avail { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
    .duties .avail .button { min-height: 40px; padding: 6px 12px; font-size: 15px; width: auto; }
    .duties .avail .state { font-weight: 700; }
    .duties .avail .state.no { color: var(--bad); }
    .duties .avail .state.yes { color: var(--good); }
    .duty-line { margin: 0 0 10px; font-size: 15px; overflow-wrap: anywhere; }
    .inbox { margin: 28px 0 8px; border-top: 1px solid var(--line); padding-top: 14px; }
    .inbox > summary { cursor: pointer; font-size: 17px; font-weight: 700; padding: 6px 0; }
    .inbox textarea { margin: 6px 0 4px; }
    .inbox-label { display: block; font-weight: 700; margin-top: 8px; }
    /* Instant scans: the Recent scans list under the result card */
    .recent-box { margin: 0 0 14px; }
    ul.recent { list-style: none; margin: 4px 0 0; padding: 0; }
    ul.recent li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; margin: 0 0 4px; border-radius: 10px; background: var(--surface); border-left: 6px solid var(--line); }
    ul.recent li.recent-good { border-left-color: var(--good); }
    ul.recent li.recent-warn { border-left-color: var(--warn); }
    ul.recent li.recent-bad { border-left-color: var(--bad); background: var(--bad-soft); }
    .recent-name { font-weight: 700; overflow-wrap: anywhere; }
    .recent-state { white-space: nowrap; color: var(--muted); }
    /* Notices (Notices.gs) and the form to post one. One colour on every page; on a class day a one-line strip. */
    .notices { margin: 16px 0; }
    .notices h2 { margin: 18px 0 8px; font-size: 18px; }

    /** A beep and a buzz every 2.5 seconds until the alert is tapped (a phone may keep quiet until the page was touched once). */
    function escRingStart() {
      escRingStop();
      var once = function () {
        try { if (navigator.vibrate) navigator.vibrate([400, 150, 400]); } catch (er) { /* no vibration */ }
        try {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) return;
          if (!escS.audio) escS.audio = new C();
          var ac = escS.audio;
          if (ac.state === 'suspended' && ac.resume) ac.resume();
          [0, 0.35].forEach(function (at, i) {
            var osc = ac.createOscillator();
            var g = ac.createGain();
            osc.frequency.value = i ? 660 : 880;
            g.gain.setValueAtTime(0.0001, ac.currentTime + at);
            g.gain.exponentialRampToValueAtTime(0.4, ac.currentTime + at + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + at + 0.3);
            osc.connect(g); g.connect(ac.destination);
            osc.start(ac.currentTime + at); osc.stop(ac.currentTime + at + 0.32);
          });
        } catch (er) { /* no sound */ }
      };
      once();
      escS.ring = setInterval(once, 2500);
    }
    function escRingStop() {

    // ------------------------------------------------------------------

     * or on Google's page, the venue code: "Scan the venue code" (typing its letters as a last resort).

    function checkIn(proof) {

    function noticesStrip(list, classDay, extra) {
      list = list || [];
      if (!list.length && !extra) return null;
      var seen = {};
      try { seen = JSON.parse(window.localStorage.getItem('noticesSeen') || '{}') || {}; } catch (e) { seen = {}; }
      var idOf = function (n) {
        var s = String(n.text) + '|' + String(n.from || ''), x = 0;
        for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0;
        return 'n' + (x >>> 0).toString(36);
      };
      var fresh = list.some(function (n) { return !seen[idOf(n)]; });
      try {
        list.forEach(function (n) { seen[idOf(n)] = Date.now(); });
        var kept = {};
        Object.keys(seen).sort(function (a, b) { return seen[b] - seen[a]; }).slice(0, 60).forEach(function (k) { kept[k] = seen[k]; });
        window.localStorage.setItem('noticesSeen', JSON.stringify(kept));

    /** Copies the text in a box: with the phone's copy if it allows, otherwise by selecting it for the person to copy. */
    function copyText(box, out) {
      var done = function (ok) { out.textContent = ok ? 'Copied.' : 'Now copy the selected link.'; };
      var fallback = function () {
        box.focus();

        var ok = false;

          return;
        }

        var pin = h('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '4', autocomplete: 'off', 'aria-label': W('kiosk.pinAsk', 'The PIN to leave kiosk mode') });

        add(exit, h('form', { onsubmit: function (e) {
          e.preventDefault();
          call('kioskEnd', [pin.value], function (r) {
            if (r && r.ok) { if (!leaveKioskCode()) return; exitKiosk(); return; }
            say.textContent = (r && r.message) || 'Please try again.';
            pin.value = '';
          }, function () { say.textContent = "Couldn't reach the management system."; });
        } }, pin, ' ', h('button', { type: 'submit', class: 'button secondary', text: W('kiosk.leave', 'Leave') }), ' ',
          h('button', { type: 'button', class: 'button secondary', text: W('links.back', 'Back'), onclick: drawExit }), say));
        pin.focus();
      };
      var drawExit = function () { exit.textContent = ''; add(exit, h('button', { type: 'button', class: 'button secondary', text: W('kiosk.exit', 'Exit'), onclick: askPin })); };
      drawExit();
      st.kioskExit = exit;
      document.body.appendChild(exit);
      stopCamera();
      cam.facing = 'user';   // the screen faces the students: the front camera
      if (ui.start) ui.start.hidden = true;
      startCamera();
      kioskReady();
    }

    /**
     * Review M2: kiosk (or poster) mode started on this phone: from now on the page uses the kiosk code (kiosk things only,
     * on this phone only), and the address bar no longer shows the head's link. The head's link stays only in this page's
     * memory, for when kiosk mode is left with the PIN.
     */
    function useKioskCode(code) {
      if (!code || !TOKEN_PATTERN.test(code)) return;
      st.realToken = st.realToken || (D && D.token) || link.token;
      try { window.localStorage.setItem('kioskDev:' + code, JSON.stringify({ id: dev.id, sig: dev.sig })); } catch (e) { /* a reload then needs the head's link */ }
      if (D) D.token = code;
      if (!IN_GOOGLE) link.token = code;
      if (IN_GOOGLE) {
        try { google.script.history.replace(null, { kiosk: code }, ''); } catch (e) { /* an older browser: the address stays */ }
      } else {
        var hash = '#app=' + encodeURIComponent(link.app) + '&kiosk=' + code;
        try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) { /* fine */ }
        keepAddress(hash);
      }
    }
    /** Kiosk mode left with the PIN: back to the head's own link (from memory). False when it isn't known any more (a reload). */
    function leaveKioskCode() {
      var code = (D && D.token) || link.token;
      try { window.localStorage.removeItem('kioskDev:' + code); } catch (e) { /* nothing kept */ }
      if (!st.kioskCodePage && !st.realToken) return true;   // kiosk mode from before kiosk codes: nothing to change
      if (!st.realToken) {
        exitKioskScreen();
        fatal(W('kiosk.endedTitle', 'Kiosk mode has ended'), W('kiosk.endedText', 'This address worked only while kiosk mode was on, on the kiosk phone. Open your own link again to use your page.'));
        return false;
      }
      var real = st.realToken;
      st.realToken = '';
      st.kioskCodePage = false;
      if (D) D.token = real;
      if (!IN_GOOGLE) link.token = real;
      if (IN_GOOGLE) {
        try { google.script.history.replace(null, { attendant: real }, ''); } catch (e) { /* fine */ }
      } else {
        var hash = '#app=' + encodeURIComponent(link.app) + '&attendant=' + real;
        try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) { /* fine */ }
        keepAddress(hash);
      }
      return true;
    }
    function exitKioskScreen() {
      st.kiosk = false;
      document.body.classList.remove('kiosk');
      if (st.kioskExit && st.kioskExit.parentNode) st.kioskExit.parentNode.removeChild(st.kioskExit);
      st.kioskExit = null;
      try { stopCamera(); } catch (e) { /* fine */ }
    }

    /** On the head's other phone while one phone is in kiosk mode: a note, with End kiosk mode (no PIN: it is their own phone). */
    function kioskElsewhere() {
      var box = h('div', { class: 'banner warn' });
      add(box, [h('span', { text: W('kiosk.elsewhere', 'Kiosk mode is on, on your other phone.') + ' ' }),
        h('button', { type: 'button', class: 'button secondary small-button', text: W('kiosk.endThere', 'End kiosk mode there'), onclick: function () {
          call('kioskEnd', [''], function (r) {
            box.textContent = '';
            add(box, h('span', { text: r && r.ok ? W('kiosk.ended', 'Kiosk mode is ended: that phone shows the scanning page again within a minute.') : (r && r.message) || 'Please try again.' }));
            if (r && r.ok && D.kiosk) D.kiosk.elsewhere = false;
          }, function () { /* try again */ });
        } })]);
      return box;
    }

    function kioskReady() {
      if (!st.kiosk || st.busy) return;
      ui.result.hidden = false;
      ui.result.className = 'result';
      ui.result.textContent = '';
      add(ui.result, [h('p', { class: 'result-title', text: W('kiosk.ready', 'Welcome!') }),
        h('p', { class: 'result-text', text: W('kiosk.help', 'Hold your code up to the camera.') })]);
    }

    function exitKiosk() {
      if (!st.kiosk) return;
      st.kiosk = false;
      if (D.kiosk) D.kiosk.on = false;
      clearTimeout(st.kioskTimer);
      document.body.classList.remove('kiosk');
      if (st.kioskExit && st.kioskExit.parentNode) st.kioskExit.parentNode.removeChild(st.kioskExit);
      st.kioskExit = null;
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); } catch (e) { /* fine */ }
      stopCamera();
      cam.facing = 'environment';
      build();
    }

    /** Puts the student's photo in place of their initials, so the assistant can check it's them. */
    function showPhoto(id, face) {
      var put = function (dataUrl) {
        if (st.shown !== id || !face.parentNode) return;
        var img = h('img', { class: 'face', src: dataUrl, alt: 'Photo of the student' });
        img.onerror = function () { if (img.parentNode) img.parentNode.replaceChild(face, img); };
        face.parentNode.replaceChild(img, face);
      };
      if (photos[id]) { put(photos[id]); return; }
      call('photo', [id], function (r) {
        if (!r || !r.ok || typeof r.dataUrl !== 'string' || r.dataUrl.indexOf('data:image/') !== 0) return;
        var keys = Object.keys(photos);
        if (keys.length >= 40) delete photos[keys[0]];
        photos[id] = r.dataUrl;
        put(r.dataUrl);
      }, function () { /* keep the initials */ });
    }

    // ------------------------------------------------------------------
    //  Scanning
    // ------------------------------------------------------------------

    /** A code was read (by photo or live camera) or an ID was typed. */
    function handleCode(text, how) {
      // The venue code's QR code (the head assistant's phone): it checks this person in (Venue.gs).
      if (/^VENUE-[A-Za-z0-9]{6,40}$/.test(String(text || '').trim())) {
        if (D.duty && !D.duty.checkedIn && (D.duty.onDuty || D.duty.head)) { venueSend(String(text).trim()); return; }
        showResult({ kind: 'warn', title: W('checkin.codeTitle', 'Venue code'), message: W('checkin.codeNotNeeded', 'This is the venue code, for checking in. You are checked in already, or not on duty today.') });
        return;
      }
      if (st.checkOnly) { personCheck(String(text || '').trim(), true); return; }   // UX16 T2: a check only: nothing is recorded
      var id = idFromText(text);
      if (!id) {
        showResult({ kind: 'bad', title: 'Not a student code', message: "That code isn't a student code for this course." });
        return;
      }
      // INSTANT SCANS: a student on today's list who hasn't been scanned yet is shown at once, and the scan is saved
      // in the background while the next student is scanned. Anyone else waits for the system's answer, as before.
      var known = st.roster[id];
      if (known && !st.done[id] && how !== 'typed' && D.isClassDay && !D.scanClosed && (known.until === null || Date.now() < known.until)) {
        st.done[id] = true;
        delete st.roster[id];
        var item = { text: text, how: how, id: id, name: known.name, at: Date.now() };
        showResult({ kind: 'good', title: W('scan.instant', 'Scanned'), student: { id: id, name: known.name, className: known.className, photo: true },
          message: W('scan.instantSaving', 'Saving\u2026 you can scan the next student.') });
        st.instantShown = id;
        addRecent(item, null);
        st.line.push(item);
        saveLine();   // kept in the browser's storage until the system answers, so a closed page doesn't lose it
        pumpLine();
        return;
      }
      submit(text, how);
    }

    /**
     * INSTANT SCANS: sends the scans in the line one at a time, in the background. Each answer replaces "Saving..." on its
     * card (if it is still shown) and in the Recent scans list. Without a connection, the scan is kept on this phone.
     */
    function pumpLine() {
      if (st.lineBusy || !st.line.length) return;
      st.lineBusy = true;
      var item = st.line[0];
      var done = function () { st.line.shift(); saveLine(); st.lineBusy = false; if (st.line.length) pumpLine(); else refreshSoon(); };
      var answer = function (res) {
        addRecent(item, res);
        if (st.instantShown === item.id && st.shown === item.id && !st.busy) {
          showResult(res);   // the card on the screen gets its final title (Present, Late ...)
        } else if (res && res.kind && res.kind !== 'good' && !st.busy) {
          showResult(res);   // a problem with an earlier scan comes back on the screen (with its sound), so nobody misses it
          st.instantShown = null;
        } else if (res && res.kind && res.kind !== 'good') {
          feedback(res.kind);
        }
      };
      // ago: how long since the scan was made. The system counts back from its own clock, so this phone's clock doesn't matter.
      call('scan', [item.text, item.how, item.retry || null, { ago: Math.max(0, Date.now() - item.at) }, true], function (res) {
        if (res && res.title === 'Busy' && res.retry && !item.retry) { item.retry = res.retry; st.lineBusy = false; setTimeout(pumpLine, 800); return; }
        answer(res && res.kind ? res : { kind: 'bad', title: 'Not saved', message: GENERIC });
        if (!res || !res.kind || res.title === 'Busy') delete st.done[item.id];   // not saved: it can be scanned again
        done();
      }, function (err) {
        if (err && err.notConnected) { answer({ kind: 'bad', title: 'Not saved', message: NOT_CONNECTED }); delete st.done[item.id]; done(); return; }
        if (err && err.name === 'AbortError') {   // it took too long: it may still have been saved, so it isn't sent twice
          answer({ kind: 'warn', title: 'No answer yet', message: item.name + ': the system hasn\'t answered, so this scan may not have been saved. Scan the code again to check.' });
          delete st.done[item.id];
          done();
          return;
        }
        // No connection: kept on this phone with the moment it was scanned, and sent by itself later.
        queue.push({ text: item.text, how: item.how, at: item.at });
        saveQueue();
        renderQueue();
        addRecent(item, { kind: 'warn', title: W('scan.savedPhone', 'Saved on this phone') });
        scheduleQueue(20000);
        done();
      });
    }

    /** After the line is sent, today's lists are fetched once (the answers to instant scans don't carry them). */
    function refreshSoon() {
      clearTimeout(st.refreshSoonTimer);
      st.refreshSoonTimer = setTimeout(function () { if (!st.busy && !st.line.length) refreshStatus(false); }, 4000);
    }

    /** The Recent scans list: the last few instant scans, "Saving..." until the answer comes. */
    function addRecent(item, res) {
      var found = null;
      st.recent.forEach(function (r) { if (r.item === item) found = r; });
      if (!found) { found = { item: item, res: null }; st.recent.unshift(found); }
      if (res) found.res = res;
      st.recent = st.recent.slice(0, 8);
      if (!ui.recent) return;
      ui.recent.textContent = '';
      if (!st.recent.length) return;
      add(ui.recent, h('p', { class: 'list-title', text: W('scan.recent', 'Recent scans') }));
      add(ui.recent, h('ul', { class: 'recent' }, st.recent.map(function (r) {
        var k = !r.res ? 'saving' : r.res.kind === 'good' ? 'good' : r.res.kind === 'warn' ? 'warn' : 'bad';
        return h('li', { class: 'recent-' + k }, h('span', { class: 'recent-name', text: r.item.name }),
          h('span', { class: 'recent-state', text: !r.res ? 'Saving\u2026' : (r.res.title || '') + (r.res.time ? ' \u00b7 ' + r.res.time : '') }));
      })));
    }

    function submit(text, how, retry) {
      st.busy = true;
      var seq = ++st.seq;
      showWorking(retry ? 'Busy. Trying again\u2026' : 'Saving\u2026');
      var noAnswer = function () {
        st.seq++;
        st.busy = false;
        cam.lastText = '';   // the live camera may read the same code again straight away
        showResult({ kind: 'warn', title: 'No answer yet', message: "The system hasn't answered, so this scan may not have been saved. Scan the code again to check." });
      };
      var timer = setTimeout(function () { if (seq === st.seq) noAnswer(); }, 30000);
      call('scan', retry ? [text, how, retry] : [text, how], function (res) {
        if (seq !== st.seq) { if (res && res.status) renderStatus(res.status); return; }
        clearTimeout(timer);
        if (res && res.title === 'Busy' && res.retry && !retry) {   // once more by itself, keeping the time it first arrived
          setTimeout(function () { if (seq === st.seq) submit(text, how, res.retry); }, 1000);
          return;
        }
        st.busy = false;
        if (!res || !res.kind || res.title === 'Busy' || res.title === 'Not saved') cam.lastText = '';   // not saved: try again
        showResult(res && res.kind ? res : { kind: 'bad', title: 'Not saved', message: GENERIC });
        if (res && res.status) renderStatus(res.status);
        if (res && res.title === 'Not on duty today') reopen();   // the head assistant changed this assistant's duty
      }, function (err) {
        if (seq !== st.seq) return;
        clearTimeout(timer);
        if (err && err.name === 'AbortError') { noAnswer(); return; }   // it took too long: it may still have been saved
        st.busy = false;
        cam.lastText = '';
        if (err && err.notConnected) { showResult({ kind: 'bad', title: 'Not saved', message: NOT_CONNECTED }); return; }
        if (retry) { showResult({ kind: 'bad', title: 'Not saved', message: OFFLINE }); return; }   // after Busy: scan again, it keeps its time
        keepScan(text, how);
      });
    }

    // ------------------------------------------------------------------
    //  Scans kept on the phone while it has no connection
    //  Each is sent as soon as the connection is back, with the moment it was made, so nobody is
    //  marked late for the network. They are kept in the browser's storage, so a closed page keeps them.
    // ------------------------------------------------------------------

    function queueKey() { return 'scanQueue:' + ((D && D.token) || link.token || ''); }
    function loadQueue() {
      try {
        var raw = window.localStorage.getItem(queueKey());
        var list = raw ? JSON.parse(raw) : [];
        queue = Array.isArray(list) ? list.filter(function (q) { return q && typeof q.text === 'string' && q.at; }) : [];
      } catch (e) { queue = []; }
      // Instant scans that hadn't had their answer when the page was closed: sent again with the kept scans
      // (one that was saved after all answers "Already marked today", so nothing is counted twice).
      // Only when the page opens: when it is built again later, the line is still being sent from this page.
      if (st.started) return;
      try {
        var left = JSON.parse(window.localStorage.getItem(lineKey()) || '[]');
        if (Array.isArray(left) && left.length) {
          left.forEach(function (q) {
            if (q && typeof q.text === 'string' && q.at && !queue.some(function (k) { return k.text === q.text && k.at === q.at; })) {
              queue.push({ text: q.text, how: q.how, at: q.at });
            }
          });
          window.localStorage.removeItem(lineKey());
          saveQueue();
        }
      } catch (e) { /* nothing kept */ }
    }
    function lineKey() { return 'scanLine:' + ((D && D.token) || link.token || ''); }
    /** INSTANT SCANS: the line waiting for its answers, kept in the browser's storage (see loadQueue). */
    function saveLine() {
      try {
        if (st.line.length) window.localStorage.setItem(lineKey(), JSON.stringify(st.line.map(function (q) { return { text: q.text, how: q.how, at: q.at }; })));
        else window.localStorage.removeItem(lineKey());
      } catch (e) { /* this page still sends them */ }
    }
    function saveQueue() {
      try {
        if (queue.length) window.localStorage.setItem(queueKey(), JSON.stringify(queue));
        else window.localStorage.removeItem(queueKey());
      } catch (e) { /* not kept across a reload: still sent from this page */ }
    }
    function keepScan(text, how) {
      queue.push({ text: text, how: how, at: Date.now() });
      saveQueue();
      renderQueue();
      showResult({ kind: 'warn', title: W('scan.savedPhone', 'Saved on this phone'), message: waitingText() + ' ' +
        W('scan.savedHelp', 'No connection just now. It counts from the moment you scanned, and is sent by itself when the connection is back. Carry on scanning.') +
        (IN_GOOGLE ? ' ' + W('scan.keepOpen', 'Keep this page open until they are sent: this page can only send them while it is open.') : '') });
      st.keptShown = true;
      scheduleQueue(20000);
    }
    /** Phase 9: "Saved on this phone - will send when online (2 waiting)". */
    function waitingText() { return W('scan.waiting', 'Saved on this phone \u2013 will send when online ({n} waiting).').replace('{n}', queue.length); }
    function renderQueue() {
      if (!ui.queue) return;
      ui.queue.textContent = '';
      if (st.offlineStart) add(ui.queue, h('div', { class: 'alert warn', role: 'status', text: W('live.offlineOpen',
        'No connection: this page opened from this phone. Scans are saved on this phone and sent by themselves when it is online. Check-in needs a connection.') }));
      if (!queue.length && !sentLater.length) return;
      var box = h('div', { class: 'queue', role: 'status' });
      if (queue.length) {
        add(box, h('p', { text: waitingText() + (st.sending ? ' Sending\u2026' : '') }));
        if (IN_GOOGLE) add(box, h('p', { class: 'help', text: W('scan.keepOpen', 'Keep this page open until they are sent: this page can only send them while it is open.') }));
        if (!st.sending) add(box, h('button', { type: 'button', class: 'button secondary', text: 'Send now', onclick: function () { sendQueue(); } }));
      } else {
        add(box, h('p', { text: 'The kept scans were sent.' }));
      }
      if (sentLater.length) {
        add(box, h('ul', {}, sentLater.slice(-6).map(function (t) { return h('li', { text: t }); })));
      }
      add(ui.queue, box);
    }
    function scheduleQueue(ms) {
      if (st.queueTimer) clearTimeout(st.queueTimer);
      st.queueTimer = setTimeout(function () { st.queueTimer = 0; if (queue.length) sendQueue(); }, ms);
    }
    /** Sends the kept scans one at a time, oldest first, and stops at the first failure (it tries again later). */
    function sendQueue() {
      if (st.sending || !queue.length || !D || !D.token) return;
      st.sending = true;
      renderQueue();
      var item = queue[0];
      call('scan', [item.text, item.how, null, { ago: Math.max(0, Date.now() - item.at) }], function (res) {
        st.sending = false;
        if (res && res.title === 'Busy') { renderQueue(); scheduleQueue(5000); return; }   // kept: tried again shortly
        if (res && res.kind) {
          st.offlineStart = false;   // the system answered: the page is online again
          queue.shift();
          saveQueue();
          sentLater.push((res.student && res.student.name ? res.student.name + ': ' : '') + (res.title || 'Sent') +
            (res.sentLater ? ' (scanned at ' + res.sentLater + ')' : ''));
          if (res.status) renderStatus(res.status);
          if (st.keptShown) { showResult(res); st.keptShown = false; }   // the "Kept on this phone" card gives way to the real result
        } else {
          queue.shift();   // an answer without a result: not kept again, the assistant can scan again
          saveQueue();
        }
        renderQueue();
        if (queue.length) scheduleQueue(300); else refreshStatus();
      }, function () {
        st.sending = false;
        renderQueue();
        scheduleQueue(20000);
      });
    }

    function onPhoto(e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';   // so the next photo always counts as new
      if (!file || st.busy) return;
      prepareSound();
      st.busy = true;
      showWorking('Reading the code\u2026');
      decodePhoto(file).then(function (text) {
        st.busy = false;
        if (text) { handleCode(text, 'photo'); return; }
        showResult({ kind: 'bad', title: 'No code found', message: "Couldn't find a code in that photo. Take it again a little closer, " +
          'so the code fills most of the picture, with the phone held still.' });
      }, function () {
        st.busy = false;
        showResult({ kind: 'bad', title: "Couldn't open the photo", message: 'Please take the photo again.' });
      });
    }

    function toggleTyped() {
      var opening = ui.typeForm.hidden;
      ui.typeForm.hidden = !opening;
      ui.typeToggle.setAttribute('aria-expanded', opening ? 'true' : 'false');
      ui.typeToggle.textContent = opening ? W('scan.hideTyping', 'Hide typing') : W('scan.typeInstead', 'Type the ID instead');
      if (opening) ui.typeInput.focus();
    }

    function onTyped(e) {
      e.preventDefault();
      prepareSound();
      var raw = ui.typeInput.value.trim();
      var id = idFromText(raw);
      var digits = raw.replace(/\D/g, '').length;
      var phone = !id && /^\+?[\d\s().-]+$/.test(raw) && digits >= 7 && digits <= 15;   // the system finds the student by it
      if (!id && !phone) {
        ui.typeError.textContent = "That isn't a Student ID (8 letters and numbers, like K7Q2-M9XD) or a phone number.";
        ui.typeError.hidden = false;
        return;
      }
      ui.typeError.hidden = true;
      if (st.busy) return;
      ui.typeInput.value = '';
      ui.typeInput.blur();   // closes the keyboard, so the result shows
      submit(id || raw, 'typed');
    }

    // ------------------------------------------------------------------
    //  Reading a code from a photo
    //  First the phone's own reader if it has one, then jsQR at a few sizes.
    // ------------------------------------------------------------------

    var detectorReady = (function () {
      try {
        if (!('BarcodeDetector' in window)) return Promise.resolve(null);
        var make = function () { detector = new window.BarcodeDetector({ formats: ['qr_code'] }); return detector; };
        if (typeof window.BarcodeDetector.getSupportedFormats !== 'function') return Promise.resolve(make());
        return window.BarcodeDetector.getSupportedFormats().then(function (formats) {
          return formats.indexOf('qr_code') !== -1 ? make() : null;
        }, function () { return null; });
      } catch (e) {
        detector = null;
        return Promise.resolve(null);
      }
    })();

    function loadPicture(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () { resolve({ img: img, done: function () { URL.revokeObjectURL(url); } }); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('picture')); };
        img.src = url;
      });
    }

    /** Part of a picture (sx, sy, sw, sh), drawn at most maxSide pixels wide or high. */
    function drawPart(source, sx, sy, sw, sh, maxSide) {
      var scale = Math.min(1, maxSide / Math.max(sw, sh));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * scale));
      c.height = Math.max(1, Math.round(sh * scale));
      var ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c;
    }

    function readWithJsQR(canvas, both) {
      if (typeof window.jsQR !== 'function') return '';

      return gsr('getPaperLayout', [res.qr.text, hand.student.id]).then(function (r) {
        if (!r || !r.ok) {
          var err = new Error((r && r.message) || 'This paper could not be found.');
          err.fromServer = true;
          throw err;
        }
        hand.layouts[r.serial] = r.layout;
        return res.resume(r.layout);
      }, function () {
        var err = new Error(OFFLINE.replace('this scan was', 'this page was'));
        err.fromServer = true;
        throw err;
      });
    }

    /** Keeps what was read on a page and saves its pictures (the page, each written answer, each unclear question). */
    function keepPage(res) {
      var n = res.page;
      var page = { answers: {}, written: res.regions.length, pageFile: '', answerFiles: {}, unclearFiles: {}, saving: 0 };
      var pictures = [{ kind: 'page', n: 0, box: null }];
      res.answers.forEach(function (a) {
        var code = /^[a-d]$/.test(a.choice) ? a.choice : a.choice === '' ? '-' : '?';
        page.answers[a.q] = code;
        if (code === '?') {
          var bs = (res.bubbles || []).filter(function (b) { return b.q === a.q; });
          if (bs.length) {
            var x0 = Math.min.apply(null, bs.map(function (b) { return b.x - b.r; })) - 4;
            var y0 = Math.min.apply(null, bs.map(function (b) { return b.y - b.r; })) - 4;
            var y1 = Math.max.apply(null, bs.map(function (b) { return b.y + b.r; })) + 4;
            pictures.push({ kind: 'unclear', n: a.q, box: [x0, y0, Math.min(98, 208 - x0), y1 - y0] });
          }
        }
      });
      res.regions.forEach(function (r) { pictures.push({ kind: 'answer', n: r.q, box: r.box }); });
      var images = pictures.map(function (p) {
        var c = p.box ? window.OMR.crop(res.canvas, p.box) : res.canvas;
        return { kind: p.kind, n: p.n, data: window.OMR.toJpeg(c, p.kind === 'page' ? 0.7 : 0.8) };
      });
      res.canvas = null;
      hand.pages[n] = page;
      images.forEach(function (img) {
        hand.uploads++;
        page.saving++;
        hand.queue = hand.queue.then(function () { return savePicture(page, n, img, 0); });
      });
    }

    function savePicture(page, n, img, tries) {
      return gsr('savePaperPicture', [{ serial: hand.serial, page: n, kind: img.kind, n: img.n, data: img.data }]).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.message) || 'not saved');
        if (img.kind === 'page') page.pageFile = r.id;
        else if (img.kind === 'answer') (page.answerFiles[img.n] = page.answerFiles[img.n] || []).push(r.id);
        else page.unclearFiles[img.n] = r.id;
        pictureDone(page);
      }).catch(function (err) {
        if (tries < 2) return new Promise(function (resolve) { setTimeout(resolve, 2000); }).then(function () { return savePicture(page, n, img, tries + 1); });
        pictureDone(page);
        if (hand && hand.pages[n] === page) {
          delete hand.pages[n];
          hand.error = 'The pictures of page ' + n + " couldn't be saved (" + (err && err.message || 'no connection') + '). Please photograph page ' + n + ' again.';
        }
      });
    }
    function pictureDone(page) {
      if (!hand) return;
      hand.uploads = Math.max(0, hand.uploads - 1);
      page.saving--;
      if (!hand.busy) renderHand();
    }

    function submitHand() {
      if (!hand || hand.busy || hand.uploads) return;
      var pages = {}, answers = {}, answerPictures = {}, unclearPictures = {};
      Object.keys(hand.pages).forEach(function (n) {
        var p = hand.pages[n];
        if (!p.pageFile) return;
        pages[n] = p.pageFile;
        copyInto(answers, p.answers);
        copyInto(answerPictures, p.answerFiles);
        copyInto(unclearPictures, p.unclearFiles);
      });
      hand.busy = true; hand.working = 'Handing in\u2026'; hand.error = '';
      renderHand();
      gsr('submitHandIn', [{ studentId: hand.student.id, serial: hand.serial, pages: pages, answers: answers,
        answerPictures: answerPictures, unclearPictures: unclearPictures, addPages: !!hand.addPages }]).then(function (r) {
        if (r && r.ok) { feedback('good'); hand = { finished: { ok: true, message: r.message } }; renderHand(); return; }
        if (r && r.blocked) { reopen(); return; }
        hand.busy = false; hand.working = ''; hand.error = (r && r.message) || GENERIC;
        renderHand();
      }, function () {
        hand.busy = false; hand.working = ''; hand.error = OFFLINE.replace('this scan was', 'the paper was');
        renderHand();
      });
    }

    // ------------------------------------------------------------------
    //  The live camera (on GitHub Pages; inside Google only if Google allows it again)
    // ------------------------------------------------------------------

    function cameraPossible() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
    }

    function cameraAllowedHere() {
      try {
        var policy = document.permissionsPolicy || document.featurePolicy;
        return !!(policy && typeof policy.allowsFeature === 'function' && policy.allowsFeature('camera')) && cameraPossible();
      } catch (e) {
        return false;
      }
    }

    function note(text) { if (ui.note) ui.note.textContent = text; }

    /** The assistant taps Start scanning: this tap also lets the phone beep and buzz after each scan. */
    function onStart() {
      prepareSound();
      ui.start.hidden = true;
      startCamera();
    }

    function startCamera() {
      if (cam.on || cam.starting || !ui.video) return;
      cam.starting = true;
      note('Starting the camera\u2026');
      navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: cam.facing || 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      }).then(function (stream) {
        cam.stream = stream;
        cam.track = stream.getVideoTracks()[0] || null;
        ui.video.muted = true;
        ui.video.setAttribute('playsinline', '');
        ui.video.srcObject = stream;
        var playing = ui.video.play();
        return playing && typeof playing.then === 'function' ? playing : null;
      }).then(function () {
        cam.starting = false;
        cam.on = true;
        if (ui.pause) ui.pause.hidden = false;
        setPaused(false);
        offerTorch();
        keepAwake();
        nextFrame(300);
      }).catch(function (err) {
        cam.starting = false;
        stopCamera();
        var blocked = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
        note(blocked ? 'The camera is blocked' : "The camera didn't start");
        if (ui.start) { ui.startLabel.textContent = 'Try the camera again'; ui.start.hidden = false; }
        showResult({ kind: 'warn', title: blocked ? 'Camera not allowed' : "The camera didn't start", message: blocked
          ? "Allow this page to use the camera in your browser's settings for this site, then reload the page. Until then, use Take a photo instead."
          : 'Close any other app that is using the camera, then reload this page. Until then, use Take a photo instead.' });
      });
    }

    function stopCamera() {
      clearTimeout(cam.timer);
      cam.on = false;
      if (cam.stream) cam.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { /* already stopped */ } });
      cam.stream = null;
      cam.track = null;
      cam.torch = false;
      if (ui.video) ui.video.srcObject = null;
      if (ui.torch) { ui.torch.hidden = true; ui.torch.textContent = 'Light on'; }
      if (cam.wake) { try { cam.wake.release(); } catch (e) { /* released */ } cam.wake = null; }
    }

    function nextFrame(ms) {
      clearTimeout(cam.timer);
      cam.timer = setTimeout(readFrame, ms);
    }

    function readFrame() {
      if (!cam.on) return;
      if (cam.paused || st.busy || document.hidden || Date.now() < cam.holdUntil || ui.video.readyState < 2) { nextFrame(200); return; }
      frameText().then(function (text) {
        if (text && cam.on) {
          var now = Date.now();
          var same = text === cam.lastText && now - cam.lastSeen < 6000;   // the same code still in view
          cam.lastSeen = now;
          if (!same) {
            cam.lastText = text;
            cam.holdUntil = now + 2500;   // time to read the result before the next scan
            handleCode(text, 'live');
          }
        }
        nextFrame(text ? 250 : 120);
      }, function () { nextFrame(400); });
    }

    function frameText() {
      var v = ui.video;
      if (!v.videoWidth || !v.videoHeight) return Promise.resolve('');
      if (detector) return detector.detect(v).then(pickCode);
      return Promise.resolve(readWithJsQR(drawPart(v, 0, 0, v.videoWidth, v.videoHeight, 720), false));
    }

    function setPaused(paused) {
      cam.paused = paused;
      if (ui.pause) ui.pause.textContent = paused ? 'Resume' : 'Pause';
      if (ui.viewer) ui.viewer.className = 'viewer' + (paused ? ' paused' : '');
      note(paused ? 'Paused. Tap Resume to scan again.' : st.kiosk ? W('kiosk.aim', 'Hold your code inside the square.') : "Point the camera at a student's code.");
    }

    function togglePause() {
      prepareSound();
      if (!cam.on) { startCamera(); return; }
      setPaused(!cam.paused);
      if (!cam.paused) { cam.lastText = ''; nextFrame(100); }
    }

    function offerTorch() {
      try {
        var caps = cam.track && typeof cam.track.getCapabilities === 'function' ? cam.track.getCapabilities() : null;
        if (caps && caps.torch && ui.torch) ui.torch.hidden = false;
      } catch (e) { /* no light */ }
    }

    function toggleTorch() {
      if (!cam.track) return;
      var want = !cam.torch;
      cam.track.applyConstraints({ advanced: [{ torch: want }] }).then(function () {
        cam.torch = want;
        ui.torch.textContent = want ? 'Light off' : 'Light on';
      }, function () { ui.torch.hidden = true; });
    }

    /** Keeps the screen on while the live camera is scanning, if the phone allows it. */
    function keepAwake() {
      try {
        if (!navigator.wakeLock || cam.wake) return;
        navigator.wakeLock.request('screen').then(function (lock) {
          cam.wake = lock;
          lock.addEventListener('release', function () { cam.wake = null; });
        }, function () { /* not allowed: fine */ });
      } catch (e) { /* not available */ }
    }

    function onVisibility() {
      if (document.hidden) {
        if (cam.on) { cam.resume = true; stopCamera(); }   // gives the camera back to the phone
        return;
      }
      if (cam.resume) { cam.resume = false; startCamera(); }
      if (!st.busy && !endFormOpen() && Date.now() - st.lastStatusAt > 20000) refreshStatus(false);
    }

    // ------------------------------------------------------------------

    /** One count on a class card, with a sign beside its colour (a tick, a stopwatch, a cross), so colour is never the only clue. */
    function count(label, n, cls, sign) {
      return h('span', { class: cls }, sign ? h('span', { class: 'sign', 'aria-hidden': 'true', text: sign + ' ' }) : null, h('b', { text: String(n) }), ' ' + label);

    function missingList(c) {

      if (!c.missing.length) return h('p', { class: 'muted', text: W('scan.allScanned', 'Everyone on the list has been scanned.') });
      // TAP A NAME (A2): a student without their code is marked by tapping their name here, then Mark. The same rules as a

      var canPick = can('markByTap') && D.ready && D.isClassDay && !D.scanClosed && (D.allClasses || c.className === D.assistantClass) && st.mode !== 'handin';
      return [h('p', { class: 'list-title', text: W('scan.notScanned', 'Not scanned yet (') + c.missing.length + ')' }),
        canPick ? h('p', { class: 'help pick-help', id: 'pick-help-' + c.className.replace(/\W/g, ''), text: W('scan.pickHelp', 'No code with them? Tap their name to mark them.') }) : null,
        h('ul', { class: 'missing' + (canPick ? ' pickable' : '') }, c.missing.map(function (m) {

          var li = h('li');
          var row = h('button', { type: 'button', class: 'pick-name', 'data-ability': 'markByTap', 'aria-describedby': 'pick-help-' + c.className.replace(/\W/g, '') },
            h('span', { text: m.name, 'data-initials': initials(m.name) }));

    /** "Mark Ada Obi present?" with Mark and Cancel, in the student's own row. Mark sends it as a scan picked from the list. */
    function askPick(li, row, m) {
      if (st.busy) return;
      Array.prototype.forEach.call(document.querySelectorAll('.pick-ask'), function (x) { if (x.__cancel) x.__cancel(); });
      row.hidden = true;

      var cancel = function () { if (ask.parentNode) ask.parentNode.removeChild(ask); row.hidden = false; };
      ask.__cancel = cancel;
      add(ask, [h('p', { class: 'pick-question', text: W('scan.pickAsk', 'Mark {name} present?').replace('{name}', m.name) }),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'button primary', text: W('scan.mark', 'Mark'), onclick: function () {
            cancel();

            submit(m.id, 'picked');

          h('button', { type: 'button', class: 'button secondary', text: W('scan.cancel', 'Cancel'), onclick: cancel }))]);

    /** Who teaches the class today: the facilitators who checked in, or else the one placed. */
    function staffLine(c) {
      var s = c.staff || { placed: null, checkins: [] };
      var people = s.checkins && s.checkins.length ? s.checkins : (s.placed ? [s.placed] : []);
      var text = s.checkins && s.checkins.length
        ? 'Facilitator: ' + s.checkins.map(function (x) { return x.name + (x.time ? ' (checked in ' + x.time + ')' : ''); }).join(', ')
        : s.placed ? W('scan.facilitatorNotHere', 'Facilitator: {name} (not here yet)').replace('{name}', s.placed.name) : 'No facilitator placed yet.';
      var face = people.length ? h('div', { class: 'mini', 'aria-hidden': 'true', text: initials(people[0].name) }) : null;
      var line = h('p', { class: 'staff' }, face, h('span', { text: text }));
      if (face && people[0].photo && people[0].id) showAdminPhoto(people[0].id, face);
      return line;
    }

    function showAdminPhoto(id, face) {
      if (window.lowData && window.lowData()) return;   // Phase 9: low-data mode, initials only (not a photo that checks who someone is)
      var put = function (dataUrl) {
        if (!face.parentNode) return;
        var img = h('img', { class: 'mini', src: dataUrl, alt: '' });
        img.onerror = function () { if (img.parentNode) img.parentNode.replaceChild(face, img); };
        face.parentNode.replaceChild(img, face);
      };
      if (adminPhotos[id]) { if (adminPhotos[id] !== 'none') put(adminPhotos[id]); return; }
      adminPhotos[id] = 'none';   // asked once per page; tap Refresh after a new photo
      call('adminPhoto', [id], function (r) {
        if (!r || !r.ok || typeof r.dataUrl !== 'string' || r.dataUrl.indexOf('data:image/') !== 0) return;
        adminPhotos[id] = r.dataUrl;

    // ------------------------------------------------------------------
    //  Class ended: the end time and the assistant's answers (in the hall only)
    // ------------------------------------------------------------------

    function endFormOpen() {   // also "Mark ... present?" open in Not scanned yet: the lists don't refresh under it
      return Object.keys(st.ending).length > 0 || !!document.querySelector('.pick-ask');
    }

    /** The bottom of a class card: Class ended sent, the form being filled in, or the button that opens it. */
    function endPart(c) {
      if (!D.ready || !D.isClassDay) return null;
      // UX16 A1: the report is for the end of class: from 15 minutes before the class's end time (reportOpen, the system's clock).
      if (c.reportOpen === false && !st.ending[c.className] && !c.endSent && !st.ended[c.className]) return null;
      var box = h('div', { class: 'end' });
      var sent = st.ended[c.className];
      if (st.ending[c.className]) {
        add(box, st.ending[c.className].el);   // the same form, so nothing typed is lost
      } else if (c.endSent || sent) {
        add(box, h('p', { class: 'done-line', text: '\u2713 ' + W('scan.endSent', 'You sent the end-of-class report') + (c.ended ? ': ' + c.className + ' ended at ' + c.ended + '.' : '.') }));
        if (sent) add(box, banner('good', sent));
      } else {
        if (c.ended) add(box, h('p', { class: 'muted', text: c.className + ' ended at ' + c.ended + ', as another assistant reported.' }));
        add(box, h('button', { type: 'button', class: 'button ' + (endOnTop() ? 'primary' : 'secondary') + ' wide', text: W('scan.classEnded', 'End-of-class report'),
          onclick: function () { openEndForm(c.className); } }));
        add(box, h('p', { class: 'help', text: W('scan.classEnded.help', 'At the end of class: give the time it ended') +
          ((D.feedback || []).length ? ' and answer a few questions.' : '.') +
          (D.studentFeedback && !c.ended ? ' Then the students marked present or late get their feedback link.' : '') }));
      }
      return box;
    }

    /** The time the system's clock shows now, for the time box ("14:05"), worked out from the last refresh. */
    function systemTimeNow() {
      var m = /^(\d{1,2}):(\d{2}) ?([AP])M$/i.exec(String(st.status && st.status.timeText || ''));
      var minutes;
      if (m) {
        minutes = (Number(m[1]) % 12 + (m[3].toUpperCase() === 'P' ? 12 : 0)) * 60 + Number(m[2]);
        minutes += Math.floor(Math.max(0, Date.now() - st.lastStatusAt) / 60000);
      } else {
        var d = new Date();
        minutes = d.getHours() * 60 + d.getMinutes();
      }
      minutes = Math.min(minutes, 24 * 60 - 1);
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return pad(Math.floor(minutes / 60)) + ':' + pad(minutes % 60);
    }

    function openEndForm(className) {
      var i = (st.status && st.status.classes || []).map(function (c) { return c.className; }).indexOf(className);
      var prefix = 'end-' + (i === -1 ? 0 : i);
      var timeBox = h('input', { type: 'time', id: prefix + '-time', required: true, 'aria-describedby': prefix + '-time-help ' + prefix + '-time-err' });
      timeBox.value = systemTimeNow();
      var timeErr = h('p', { class: 'q-error', id: prefix + '-time-err', hidden: true });
      var timeField = h('div', { class: 'end-time' },
        h('label', { for: prefix + '-time', text: 'When did the class end?' }), timeBox,
        h('p', { class: 'help', id: prefix + '-time-help', text: 'It shows the time now. Change it if the class ended earlier.' }), timeErr);
      var box = h('div');
      var questions = D.feedback || [];
      var form = questionsForm(box, questions, prefix);
      var status = h('div', { 'aria-live': 'polite' });
      var send = h('button', { type: 'submit', class: 'button primary', text: 'Send' });
      var cancel = h('button', { type: 'button', class: 'button secondary', text: 'Cancel' });
      var el = h('form', { class: 'end-form', novalidate: true },
        h('h3', { tabindex: '-1', text: W('scan.classEnded', 'End-of-class report') + (D.allClasses ? ' \u00b7 ' + className : '') }),
        timeField, box, status, h('div', { class: 'row' }, send, cancel));
      var entry = { el: el, busy: false };
      var say = function (kind, text) { status.textContent = ''; if (text) add(status, banner(kind, text)); };
      var timeProblem = function (text) {
        timeField.className = 'end-time' + (text ? ' invalid' : '');
        timeErr.textContent = text || '';
        timeErr.hidden = !text;
        if (text) timeBox.setAttribute('aria-invalid', 'true'); else timeBox.removeAttribute('aria-invalid');
      };
      timeBox.addEventListener('input', function () { timeProblem(''); });
      el.addEventListener('input', function () { if (!entry.busy) say('', ''); });
      el.addEventListener('change', function () { if (!entry.busy) say('', ''); });
      var setBusy = function (on) {
        entry.busy = on;
        form.disable(on);
        timeBox.disabled = on;
        send.disabled = on;
        cancel.disabled = on;
        send.textContent = '';
        if (on) add(send, [spinner(), 'Sending\u2026']); else send.textContent = 'Send';
      };
      cancel.addEventListener('click', function () {
        if (entry.busy) return;
        delete st.ending[className];
        renderStatus(st.status);
      });
      el.addEventListener('submit', function (e) {
        e.preventDefault();
        if (entry.busy) return;
        say('', '');
        var problem = timeBox.value ? '' : 'Please give the time the class ended.';
        timeProblem(problem);
        var first = form.show(form.check());
        if (problem) { say('bad', problem); timeBox.focus(); return; }
        if (first) { say('bad', 'Please check the answers marked in red.'); first.focus(); return; }
        setBusy(true);
        call('end', [className, timeBox.value, form.read()], function (res) {
          setBusy(false);
          if (res && res.blocked) { blockedPage("This scanning link isn't active", 'Ask the head assistant for a new link.'); return; }
          if (res && (res.ok || res.done)) {
            delete st.ending[className];
            st.ended[className] = res.message || 'Thank you. It is saved.';
            (st.status && st.status.classes || []).forEach(function (c) {   // shown at once; the refresh brings the rest
              if (c.className !== className) return;
              c.endSent = true;
              if (!c.ended && res.ended) c.ended = res.ended;
            });
            renderStatus(st.status);
            refreshStatus(false);
            return;
          }
          if (res && res.field === 'ended') { timeProblem(res.message); say('bad', res.message); timeBox.focus(); return; }
          var bad = res && res.errors ? form.show(res.errors) : null;
          say('bad', (res && res.message) || "Something went wrong, so this wasn't saved. Please tap Send again.");
          if (bad) bad.focus();
        }, function (err) {
          setBusy(false);
          say('bad', err && err.notConnected ? NOT_CONNECTED.replace('this scan was', 'this was')
            : "Couldn't reach the management system, so this wasn't saved. Check the internet connection, then tap Send again.");
        });
      });
      st.ending[className] = entry;
      if (D.allClasses) st.open[className] = true;   // keep its card open
      renderStatus(st.status);
      el.querySelector('h3').focus();
    }

    /** Who is on duty in the class today, and when they checked in. */
    function dutyLine(c) {
      var list = c.assistants || [];
      if (!list.length) return h('p', { class: 'duty-line muted', text: 'No assistant on duty.' });
      return h('p', { class: 'duty-line', text: (list.length > 1 ? 'Assistants on duty: ' : 'Assistant on duty: ') + list.map(function (x) {
        return x.name + (x.role ? ' \u2013 ' + x.role : '') + (x.time ? ' (checked in ' + x.time + ')' : ' (not checked in yet)');
      }).join(', ') });
    }

    function renderStatus(status) {
      ui.status.textContent = '';
      if (status && status.me) noteMe(status.me);
      if (status) st.lastStatusAt = Date.now();
      if (status && status.classes) {   // INSTANT SCANS: who is still to be scanned, so their card shows at once
        st.roster = {};
        status.classes.forEach(function (c) {
          // until: the moment (on this phone's own timer) after which this class's scans wait for the system's answer again,
