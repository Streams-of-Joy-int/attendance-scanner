<!--
  app18 (the owner, 23 Oct 2026): "S.O.J. Academy", the academy's app on the phone. It lives beside the live scanner on
  GitHub (this folder: app/, with its own manifest, icon and helper sw.js); the live scanner (../) is unchanged.
  - A person opens their own page in the browser and taps "Save this page as an app on your phone". Their page opens this
    page with their link (and this phone's name and proof for it) after a # in the address: the part after # never leaves
    the phone (browsers don't send it to any server). This page keeps it on the phone and takes it out of the address.
  - Then: Android (Chrome) shows an Install button; iPhone shows two pictures (Share, then Add to Home Screen).
  - Opened as the app: the person's own page, full-screen, inside this page (a frame). The page itself checks that it is
    inside THIS site and nowhere else (pagekit.js), and this page hands it the phone's name and proof (a handshake checked
    on both sides by exact origin), so the app counts as the same phone as the browser (two phones per staff link).
  - The app's menu (from the page: Settings, This app): Reload my page, Use a different page, Forget this phone.
  - Nothing here is sent anywhere: no analytics, no other sites' code. The only other site asked is Google Fonts, for the page's
    font (Roboto Flex, as on every page; polish18-C, LOOK-42); sw.js keeps a copy of it on the phone. The link is never shown.
-->

    book.pages = book.pages.filter(function (x) { return x.t !== p.t; });
    if (book.open === p.t || !book.pages.length) book.open = book.pages.length ? book.pages[0].t : '';
    if (book.pages.length === 1) book.open = book.pages[0].t;
    save();
    if (current && current.t === p.t) stopPage();
  }

  // ------------------------------------------------------------------ the menu (the page's Settings > This app, or the top bar's Settings): the look's sheet
  var sheet = null;
  function closeMenu() { if (sheet) { var s = sheet; sheet = null; s.close(); } }
  function openSheet(title, body, closeLabel, onClosed) {
    closeMenu();
    if (!window.SJSheet) return null;
    var mine = window.SJSheet.open({ title: title, body: body, closeLabel: closeLabel || W('app.done', 'Done'),
      onClose: function () { if (sheet === mine) sheet = null; if (onClosed) onClosed(); } });
    sheet = mine;
    sheet.el.classList.add('sj-settings-sheet');
    return sheet;
  }
  /** "Are you sure?" in the look's sheet (never a browser pop-up): what will happen, then Yes or Cancel. */
  function sureSheet(text, yesText, yes, back) {
    var done = false;
    var body = el('div', { class: 'app-sure' }, [el('p', { text: text }),
      btn(yesText || W('app.yes', 'Yes'), function () { done = true; closeMenu(); yes(); })]);
    // Cancel is the sheet's own button (top right): nothing changes, and a question asked from the menu goes back to it.
    openSheet(W('app.sure', 'Are you sure?'), body, W('app.cancel', 'Cancel'), function () { if (!done && back) setTimeout(back, 0); });
  }
  function openMenu() {
    var body = el('div');
    var rows = [];
    if (current) rows.push(item('pulse', 'blue', W('app.reload', 'Reload my page'), function () { closeMenu(); openPage(); }));
    if (book.pages.length > 1) rows.push(item('swap', 'indigo', W('app.switch', 'Switch page'), function () { closeMenu(); chooser(); }));
    rows.push(item('links', 'green', W('app.addPage', 'Add another page'), function () { closeMenu(); addHelp(); }));
    body.appendChild(group('', rows));
    if (book.pages.length > 1) {
      var opts = book.pages.map(function (p) { return [p.t, label(p), p]; }).concat([['ask', W('app.askEach', 'Ask me each time'), null]]).map(function (o) {
        var b = el('button', { type: 'button', class: 'sj-phone-item', role: 'radio', 'aria-checked': book.open === o[0] ? 'true' : 'false',
          onclick: function () { book.open = o[0]; save(); Array.prototype.forEach.call(this.parentNode.children, function (x) { x.setAttribute('aria-checked', 'false'); }); this.setAttribute('aria-checked', 'true'); } },
          [o[2] ? kindTile(o[2]) : tile('more', 'blue'), el('span', { class: 'sj-t', text: o[1],
            'data-desc': o[2] ? W('app.openStraight', 'Open straight to this page') : W('app.askEachDesc', 'Choose a page each time the app opens') }),
          el('span', { class: 'app-tick', 'aria-hidden': 'true', html: svgOf('check', 20) })]);
        return b;
      });
      var g = group(W('app.openTo', 'When the app opens'), opts);
      g.lastChild.setAttribute('role', 'radiogroup');
      g.lastChild.setAttribute('aria-label', W('app.openTo', 'When the app opens'));
      body.appendChild(g);
    }
    var danger = [];
    if (current) {
      var p = current;
      danger.push(item('trash', 'red', W('app.removeThis', 'Remove this page'), function () {
        sureSheet(W('app.sureRemove', 'Remove \u201c{name}\u201d from this app? The page keeps working from its link, and you can add it again.').replace('{name}', label(p)),
          W('app.remove', 'Remove'), function () { remove(p); startApp(); }, openMenu);
      }));
    }
    danger.push(item('eyeOff', 'red', W('app.forget', 'Forget this phone'), function () {
      sureSheet(W('app.sureForget', 'Forget this phone? The app forgets your link here. Your page keeps working from your link, and you can save it again.'),
        W('app.forget', 'Forget this phone'), function () { forget(); noPage(); }, openMenu);
    }));
    body.appendChild(group('', danger));
    openSheet(W('app.menu', 'This app'), body);
  }
  /** "Forget this phone": every page goes (and the open page forgets the copies it was handed). */
  function forget() {
    if (pageWin && pageOrigin) { try { pageWin.postMessage({ soj: 'forget' }, pageOrigin); } catch (e) { /* the page is gone already */ } }
    book.pages.forEach(function (p) { forgot[p.t] = Math.max(Date.now(), p.at || 0); });
    store.set(FORGOT, forgot);
    book = { pages: [], open: '' };
    save();
    stopPage();
  }

  // ------------------------------------------------------------------ start
  if (!isIOS) {
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = 'manifest.webmanifest';
    document.head.appendChild(link);
  }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    if (current && given && current.t === given.t && !standalone() && !loaded && frame.hidden) installScreen();
  });
  window.addEventListener('appinstalled', function () { if (!standalone()) installed(); });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { /* opens without it */ }); updates(); } catch (e) { /* */ } }

  if (!book.pages.length) noPage();
  else if (given && !standalone() && find(given.t)) { current = find(given.t); installScreen(); }   // just came from "Save as app" in the browser
  else startApp();   // the app (or this tab opened again later): straight to the page, or the chooser
})();
</script>
</body>
</html>
